<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Orogeny</title>
<style>
  html, body { margin: 0; height: 100%; background: #020306; overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .type { color: #f6eee2; font: 300 12px/1.6 "Helvetica Neue", Helvetica, Arial, sans-serif;
    letter-spacing: .42em; text-transform: uppercase; text-shadow: 0 1px 14px rgba(0,0,0,.55); }
  #veil { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; padding-bottom: 12vh; box-sizing: border-box; pointer-events: none;
    transition: opacity 2.4s ease; }
  #veil h1 { font-weight: 100; font-size: clamp(26px, 5.5vw, 72px); letter-spacing: .5em;
    margin: 0 0 .4em .5em; }
  #veil p { margin: 0; padding: 0 2em; text-align: center; opacity: .8;
    animation: breathe 3.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  #hint { position: fixed; left: 0; right: 0; bottom: 7vh; padding: 0 2em; text-align: center;
    opacity: 0; transition: opacity 2s ease; pointer-events: none; }
  #tool { position: fixed; right: 22px; bottom: 22px; width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid rgba(246,238,226,.4); display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 2s ease, background .3s; cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #tool i { border: 7px solid transparent; border-top-width: 0; border-bottom: 11px solid rgba(246,238,226,.85);
    transition: transform .45s cubic-bezier(.3,1.6,.5,1); }
  #tool.carve { background: rgba(246,238,226,.14); }
  #tool.carve i { transform: rotate(180deg); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil" class="type"><h1>Orogeny</h1><p id="go">click to begin</p></div>
<div id="hint" class="type"></div>
<div id="tool"><i></i></div>
<script>
'use strict';
/*
  OROGENY — a world you can hold, and its whole history.

  Push land up out of the sea of a small planet and it comes as fire. Wind, rain, rivers, tides,
  ice and time do the rest. After a while something lights fires on the night side; the fires
  become towns, the towns wear roads between them, and one day a spark leaves for the moon.

  The whole planet is one square texture folded onto a sphere. Per cell: bedrock height, water
  depth, suspended sediment, vegetation, ice, soil moisture, people, lava, and the way to town.
    sim      flux → flow → erode    shallow water in "virtual pipes", tides, sediment, talus
    lava     a second, slower fluid on the same grid, which freezes into bedrock
    life     ice, soil moisture, settlement, and the roads that traffic wears
    weather  moisture carried on the winds; cloud and rain wherever air is made to rise
    derive   filterable copies with normals; sun shadows and occlusion marched in map space
    air      single scattering through the atmosphere, at a third of the picture's size
    render   one march against the displaced sphere, the cloud layer, aurora, a moon; then bloom and grade
    sound    a few pixels read back from the GPU drive a synthesised score
  One rule is used four times over: a cell hands something to a lower neighbour. Water does it
  with momentum, rock when it overhangs, lava while it is hot, and travellers down a field of
  tolls, which is why the roads come out looking like rivers.
  Stand far back and time runs fast. Come close and it slows to an afternoon.
*/

const $ = id => document.getElementById(id);
const canvas = $('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' });

function fail(msg) {
  $('veil').style.opacity = 1;
  $('go').style.animation = 'none';
  $('go').textContent = msg;
  throw new Error(msg);
}
if (!gl) fail('This piece needs WebGL2, which this browser does not provide.');
const canFloat = gl.getExtension('EXT_color_buffer_float');
if (!canFloat && !gl.getExtension('EXT_color_buffer_half_float'))
  fail('This piece needs floating-point render targets, which this GPU does not provide.');
const SIMF = canFloat ? gl.RGBA32F : gl.RGBA16F;   // erosion adds very small numbers to large ones

// ───────────────────────────────────────────────────────────── maths helpers
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = (dt, tau) => 1 - Math.exp(-dt / tau);   // frame-rate independent smoothing factor
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const scale = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => scale(a, 1 / Math.hypot(a[0], a[1], a[2]));
const toward = (a, b, t) => norm(add(scale(a, 1 - t), scale(b, t)));   // ease one direction toward another

// ───────────────────────────────────────────────────────────── GL plumbing
const LEAN = `#version 300 es
precision highp float; precision highp sampler2D;
`;
const VERTEX = `#version 300 es
void main(){ gl_Position = vec4(vec2((gl_VertexID<<1)&2, gl_VertexID&2)*2.-1., 0, 1); }`;   // one big triangle

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); fail('A shader failed to compile on this GPU.'); }
  return s;
}
const vertexShader = compile(gl.VERTEX_SHADER, VERTEX);
const SETTER = { [gl.FLOAT]: 'uniform1fv', [gl.FLOAT_VEC2]: 'uniform2fv', [gl.FLOAT_VEC3]: 'uniform3fv', [gl.FLOAT_VEC4]: 'uniform4fv' };
function program(source) {
  const id = gl.createProgram(), u = {};
  gl.attachShader(id, vertexShader); gl.attachShader(id, compile(gl.FRAGMENT_SHADER, source));
  gl.linkProgram(id);
  if (!gl.getProgramParameter(id, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(id)); fail('A shader failed to link on this GPU.'); }
  for (let i = gl.getProgramParameter(id, gl.ACTIVE_UNIFORMS); i--;) {
    const info = gl.getActiveUniform(id, i);
    u[info.name.replace('[0]', '')] = { at: gl.getUniformLocation(id, info.name), set: SETTER[info.type] };
  }
  return { id, u };
}
function texture(w, h, format, filter, mips = false) {
  const t = gl.createTexture(), levels = mips ? Math.floor(Math.log2(Math.max(w, h))) + 1 : 1;
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, levels, format, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return Object.assign(t, { w, h, levels });
}
function target(...textures) {      // a framebuffer drawing into one or more same-sized textures
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  textures.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
  gl.drawBuffers(textures.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
  return { fbo, w: textures[0].w, h: textures[0].h, tex: textures[0], textures };
}
function peek(tex, level) {         // a framebuffer for reading one small mip of a texture back to the CPU
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, level);
  return fbo;
}
// Run a fragment program over a target. Uniform kinds are inferred from the values passed.
function draw(prog, to, uniforms) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, to ? to.fbo : null);
  gl.viewport(0, 0, to ? to.w : canvas.width, to ? to.h : canvas.height);
  gl.useProgram(prog.id);
  let unit = 0;
  for (const name in uniforms) {
    const u = prog.u[name], v = uniforms[name];
    if (!u) continue;
    if (v instanceof WebGLTexture) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, v); gl.uniform1i(u.at, unit++); }
    else if (typeof v === 'number') gl.uniform1f(u.at, v);
    else gl[u.set](u.at, v);
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ───────────────────────────────────────────────────────────── how big a world?
// The planet comes in two sizes. Time a burst of float-texture reads; a fast GPU gets the finer one.
function probe() {
  const prog = program(LEAN + `uniform sampler2D uT; out vec4 o;
    void main(){ ivec2 p = ivec2(gl_FragCoord.xy); vec4 s = vec4(0);
      for(int i=0;i<24;i++) s += texelFetch(uT, (p+ivec2(i*7, i*13))&511, 0);
      o = s/24.+.001; }`);
  const pair = [0, 1].map(() => target(texture(512, 512, SIMF, gl.NEAREST))), px = new Float32Array(4);
  const run = n => { for (let i = 0; i < n; i++) draw(prog, pair[i & 1], { uT: pair[1 - (i & 1)].tex }); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, px); };
  run(2);                                              // warm up, then measure
  const t = performance.now(); run(8);
  const ms = performance.now() - t;
  pair.forEach(p => { gl.deleteTexture(p.tex); gl.deleteFramebuffer(p.fbo); });
  return ms;
}
const query = new URLSearchParams(location.search);
const N = +query.get('n') || (!canFloat || matchMedia('(pointer: coarse)').matches || probe() > 5 ? 512 : 1024);
const NW = 512;                        // the weather map
const R = .3 * N;                      // planet radius, chosen so that a cell is about one world unit across
const ZS = N > 512 ? .5 : .35;         // how tall a unit of simulated height is drawn
const HMAX = 60;                       // no land or water stands higher than this
const NEAR = R + ZS * HMAX + 8, FARD = 6 * R;   // the camera's range: from just clear of the highest peak, out to where the planet is small
const MOON_R = .3, MOON_D = 6.6 * R, TIDE = .32; // the moon: its radius (in planet radii), its distance (beyond the camera's reach), its pull on the sea

// ───────────────────────────────────────────────────────────── shaders
const HEAD = LEAN + `
const float N = ${N}., NW = ${NW}., R = ${R.toFixed(1)}, ZS = ${ZS}, HMAX = ${HMAX}., FAR = 6e4;
const int M = ${N - 1}, MW = ${NW - 1};
uniform float uTime, uSea, uWarm; uniform vec3 uSeed;
uniform vec4 uTide;                    // the way to the moon, and how high it lifts the sea beneath it

// The surface lives in square textures through an octahedral map: fold a square into an
// octahedron, inflate that into a sphere. One texture covers the globe with no poles to pinch.
// The price is that each edge of the square is glued to itself, mirrored about its middle.
vec2 sgn(vec2 v){ return step(0., v)*2.-1.; }
vec3 decode(vec2 uv){
  vec2 e = uv*2.-1.; vec3 n = vec3(e.x, 1.-abs(e.x)-abs(e.y), e.y);
  n.xz -= sgn(n.xz)*max(-n.y, 0.);
  return normalize(n);
}
vec2 encode(vec3 n){
  n /= abs(n.x)+abs(n.y)+abs(n.z);
  return (n.y>=0. ? n.xz : (1.-abs(n.zx))*sgn(n.xz))*.5+.5;
}
const ivec2 RING[8] = ivec2[8](ivec2(-1,0), ivec2(1,0), ivec2(0,1), ivec2(0,-1), ivec2(-1,-1), ivec2(1,1), ivec2(1,-1), ivec2(-1,1));   // a cell's neighbours, each followed by its opposite
ivec2 wrap(ivec2 q, int m){            // a cell index that has stepped off the square comes back in, mirrored
  if(q.x<0 || q.x>m) q = ivec2(clamp(q.x, 0, m), m-q.y);
  if(q.y<0 || q.y>m) q = ivec2(m-q.x, clamp(q.y, 0, m));
  return q;
}
// Maps that get filtered carry a one-texel gutter holding the cells glued across each edge, so
// that plain bilinear sampling is seamless everywhere on the globe.
vec2 gut(vec3 n, float size){ return (encode(n)*size+1.)/(size+2.); }

// Warm at the equator, cold at the poles and on the heights. Above zero, water is liquid.
float temperature(vec3 n, float b){ return uWarm-1.5*n.y*n.y-.022*max(b-uSea, 0.); }
// The moon draws the sea into two bulges, one beneath it and one opposite, and drags them round
// the planet. This is the height the sea would settle at, relative to its mean level.
float tide(vec3 n){ float c = dot(n, uTide.xyz); return uTide.w*(1.5*c*c-.5); }
// Lava is (depth, heat, when it last ran). This much of a flow turns to rock in one tick of its
// clock: a little all the time, which builds levees and cones, and all of it once it has cooled.
float frozen(vec4 l, float tick){ return l.x<.004 ? l.x : l.x*min(tick*(.0015+.25*(1.-smoothstep(.05, .25, l.y))), 1.); }

// One value-noise function is the only source of randomness: it shapes the continents, the rock,
// the uplift under the hand, the weather, the ripples, the foam, the canopy and the stars.
float hash(vec3 p){ p = fract(p*.1031); p += dot(p, p.zyx+31.32); return fract((p.x+p.y)*p.z); }
float noise(vec3 x){
  vec3 i = floor(x), f = fract(x); f = f*f*(3.-2.*f);
  return mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x), mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x), mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
}
vec4 noised(vec3 x){                   // the same noise with its gradient, for bumps and for curls
  vec3 i = floor(x), w = fract(x), u = w*w*(3.-2.*w), du = 6.*w*(1.-w);
  float a = hash(i), b = hash(i+vec3(1,0,0)), c = hash(i+vec3(0,1,0)), d = hash(i+vec3(1,1,0)),
        e = hash(i+vec3(0,0,1)), f = hash(i+vec3(1,0,1)), g = hash(i+vec3(0,1,1)), h = hash(i+vec3(1,1,1));
  float k1 = b-a, k2 = c-a, k3 = e-a, k4 = a-b-c+d, k5 = a-c-e+g, k6 = a-b-e+f, k7 = -a+b+c-d+e-f-g+h;
  return vec4(a+k1*u.x+k2*u.y+k3*u.z+k4*u.x*u.y+k5*u.y*u.z+k6*u.z*u.x+k7*u.x*u.y*u.z,
              du*vec3(k1+k4*u.y+k6*u.z+k7*u.y*u.z, k2+k5*u.z+k4*u.x+k7*u.z*u.x, k3+k6*u.x+k5*u.y+k7*u.x*u.y));
}
const mat3 OCT = mat3(0., 1.6, 1.2, -1.6, .72, -.96, -1.2, -.96, 1.28);   // each octave doubled and rotated
float fbm(vec3 x){ float a = .5, s = 0.; for(int i=0;i<5;i++){ s += a*noise(x); x = OCT*x+7.3; a *= .5; } return s; }
float ridged(vec3 x){
  float a = .5, s = 0.;
  for(int i=0;i<4;i++){ float n = 1.-abs(2.*noise(x)-1.); s += a*n*n; x = OCT*x+3.1; a *= .5; }
  return s;
}
`;

const SIM = {};
// What never changes: the rock (hardness, the ridges it rises into, its layering, its fertility)
// and the map's metric (how long a step in each of the four grid directions is on the sphere).
SIM.bedrock = `
layout(location=0) out vec4 oRock; layout(location=1) out vec4 oLen;
vec3 at(vec2 px){ return decode(px/N)*R; }
void main(){
  vec2 p = gl_FragCoord.xy; vec3 w = at(p);
  oRock = vec4(fbm(w*.03+uSeed), ridged(w*.05+2.*noise(w*.03)+uSeed), noise(w*.011+uSeed.zxy), noise(w*.06+uSeed.yzx));
  oLen = .5*vec4(length(at(p+vec2(1,0))-at(p-vec2(1,0))), length(at(p+vec2(0,1))-at(p-vec2(0,1))),
                 length(at(p+vec2(1,1))-at(p-vec2(1,1))), length(at(p+vec2(1,-1))-at(p-vec2(1,-1))));
}`;

SIM.init = `
layout(location=0) out vec4 oS; layout(location=1) out vec4 oC;
void main(){
  vec3 n = decode(gl_FragCoord.xy/N), w = n*R;
  float c = fbm(n*1.9+uSeed)+.12*(fbm(n*6.+uSeed.yzx)-.5), land = smoothstep(.52, .62, c);
  float range = smoothstep(.5, .68, fbm(n*4.5+uSeed.zxy));                 // mountains gather in belts; the rest is plain
  float b = -11.+9.*smoothstep(.42, .53, c)+land*(2.5+5.*fbm(w*.03+uSeed)+36.*range*land*ridged(w*.022+uSeed));
  float T = temperature(n, b), lowland = smoothstep(.5, 2., b)*(1.-smoothstep(10., 30., b));
  oS = vec4(b, max(-b, 0.), 0., lowland*smoothstep(0., .3, T)*smoothstep(.25, .6, noise(w*.06+uSeed)));
  oC = vec4(3.*land*(1.-smoothstep(-.3, 0., T)), 0., .45*land, 0.);
}`;

// Virtual pipes (Mei et al. 2007): each cell pushes water to its four neighbours in proportion
// to the difference in surface height. Flux persists between steps, which is the water's inertia.
SIM.flux = `
uniform sampler2D uS, uF; out vec4 o;
// The surface that water runs down is its own height less the tide, so the moon's pull moves it too.
float top(ivec2 q){ q = wrap(q, M); vec4 c = texelFetch(uS, q, 0); return c.x+c.y-tide(decode((vec2(q)+.5)/N)); }
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec4 c = texelFetch(uS, p, 0);
  vec4 fall = top(p) - vec4(top(p+ivec2(-1,0)), top(p+ivec2(1,0)), top(p+ivec2(0,1)), top(p+ivec2(0,-1)));
  float g = min(.07, .2/max(c.y, 1e-4));       // cap the wave speed sqrt(g·depth) so deep water stays stable
  vec4 f = max(vec4(0.), texelFetch(uF, p, 0)*.996 + g*fall);
  o = f*min(1., c.y/(f.x+f.y+f.z+f.w+1e-9));   // never drain more water than the cell holds
}`;

SIM.flow = `
uniform sampler2D uS, uF; layout(location=0) out vec4 oS; layout(location=1) out vec4 oV;
const ivec2 STEP[4] = ivec2[4](ivec2(-1,0), ivec2(1,0), ivec2(0,1), ivec2(0,-1));
// Water arriving from the neighbour in direction k. Across a fold of the map that neighbour's
// pipe to us points the same way as ours to it, not the opposite way.
float arriving(ivec2 p, int k){
  ivec2 q = p+STEP[k]; vec4 f = texelFetch(uF, wrap(q, M), 0);
  return (q.x<0 || q.y<0 || q.x>M || q.y>M) ? f[k] : f[k^1];
}
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec4 c = texelFetch(uS, p, 0), f = texelFetch(uF, p, 0);     // f = flux out to left, right, up, down
  float inL = arriving(p, 0), inR = arriving(p, 1), inU = arriving(p, 2), inD = arriving(p, 3);
  float d = max(c.y + inL+inR+inU+inD - f.x-f.y-f.z-f.w, 0.);
  vec2 v = .5*vec2(inL-f.x+f.y-inR, inD-f.w+f.z-inU)/max(.5*(c.y+d), .03);
  oS = vec4(c.x, d, c.z, c.w);
  oV = vec4(v*min(1., 1.5/max(length(v), 1e-6)), 0, 0);
}`;

SIM.erode = `
uniform sampler2D uS, uV, uC, uRock, uLen, uW, uL; uniform vec4 uBrush; uniform float uBrushR, uRain, uTick; out vec4 o;
vec4 S(ivec2 q){ return texelFetch(uS, wrap(q, M), 0); }
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy); vec3 n = decode(gl_FragCoord.xy/N);
  vec4 c = S(p), l = S(p+ivec2(-1,0)), r = S(p+ivec2(1,0)), u = S(p+ivec2(0,1)), dn = S(p+ivec2(0,-1));
  vec4 diag = vec4(S(p+ivec2(-1,-1)).x, S(p+ivec2(1,1)).x, S(p+ivec2(1,-1)).x, S(p+ivec2(-1,1)).x);
  vec4 rock = texelFetch(uRock, p, 0), len = texelFetch(uLen, p, 0), life = texelFetch(uC, p, 0);
  vec2 v = texelFetch(uV, p, 0).xy;
  float b = c.x, d = c.y, veg = c.w, ice = life.x, T = temperature(n, b);
  float slope = length(.5*vec2(r.x-l.x, u.x-dn.x)/len.xy);
  // Hardness varies from place to place and from layer to layer, so hard beds stand out as
  // cliffs and ledges while soft ones slump and wash away.
  float hard = smoothstep(.25, .75, .6*rock.x+.4*noise(vec3(b*.28, rock.z*9., 0.)));

  // Sediment arrives with the current (semi-Lagrangian), then trades with the bed: fast, steep
  // water can carry more than it holds, so it digs; slow water is overloaded, so it deposits.
  vec2 q = gl_FragCoord.xy-.5-v; ivec2 i = ivec2(floor(q)); vec2 w = q-vec2(i);
  float s = mix(mix(S(i).z, S(i+ivec2(1,0)).z, w.x), mix(S(i+ivec2(0,1)).z, S(i+ivec2(1,1)).z, w.x), w.y);
  float capacity = .5*length(v)*min(d*d*30., 1.)*(1.-smoothstep(1.5, 5., d))*max(slope/sqrt(1.+slope*slope), .03);
  float e = capacity-s;
  e *= e>0. ? .07*(1.15-hard)*(1.-.75*veg)*(1.-.7*step(.05, ice)) : .06;   // roots and ice hold the ground; hard rock resists
  b -= e; s += e;

  // Talus: material slides to any neighbour it overhangs by more than the angle of repose.
  // All eight neighbours take part (with four, cones come out as pyramids), each at its true distance.
  float talus = mix(.45, 1.6, hard*hard)*(d>.25 ? .6 : 1.);
  #define SLIP(h, run) (sign(h-b)*max(abs(h-b)-talus*run, 0.))
  b += .07*(SLIP(l.x, len.x)+SLIP(r.x, len.x)+SLIP(u.x, len.y)+SLIP(dn.x, len.y))
     + .05*(SLIP(diag.x, len.z)+SLIP(diag.y, len.z)+SLIP(diag.z, len.w)+SLIP(diag.w, len.w));

  // The viewer's hand. Uplift follows ridged noise so that land rises as ranges, not bells.
  float g = exp(-2.*R*R*(1.-dot(n, uBrush.xyz))/(uBrushR*uBrushR))*uBrush.w;
  b += g>0. ? g*(.13+1.9*rock.y)*(1.-smoothstep(36., 52., b)) : g*(.6+.8*rock.w)*smoothstep(-14., -10., b);
  veg *= 1.-min(abs(g)*2., 1.);
  if(uTick>0.){                                      // the lava pass is about to freeze some of its flow: here it becomes ground
    vec4 lava = texelFetch(uL, p, 0);
    b += frozen(lava, uTick); veg *= 1.-smoothstep(0., .05, lava.x); d = max(d-.02*lava.x*lava.y, 0.);   // and it burns, and boils
  }

  // Rain where the weather says so, if it is warm enough to fall as rain; meltwater from the ice.
  float sea = uSea+tide(n);
  if(b>sea && T>0.) d += uRain*textureLod(uW, gut(n, NW), 0.).g+min(ice, .0015*T);
  if(b<sea-.3 && d>0.) d += .0015*(sea-b-d);                                 // the open ocean finds its level, which the tide keeps moving
  else if(b+d>sea+.35) d = max(d*(1.-.0012*(.4+max(T, 0.)))-.00012, 0.);    // standing water evaporates, faster where it is hot, and soaks away

  // Vegetation spreads from where it already is, as far as soil moisture and warmth allow.
  float around = max(max(l.w, r.w), max(u.w, dn.w));
  float fertile = smoothstep(.08, .45, life.z)*smoothstep(-.02, .22, T);
  float suit = step(d, .08)*step(ice, .05)*smoothstep(.1, 1.3, b-uSea-uTide.w)*(1.-smoothstep(.4, .95, slope))*(.35+.65*rock.w);
  veg += .005*suit*(.015+around)*max(fertile-veg, 0.)-.0015*max(veg-fertile*suit, 0.)-20.*max(e, 0.)-.02*step(.15, d);
  o = vec4(b, d, max(s, 0.), clamp(veg, 0., 1.));
}`;

// Lava: a second, slower fluid on the same grid. It wells up along the crests of the land the
// hand is raising, runs downhill while it is hot, stiffens as it cools (at once under water),
// and what freezes becomes bedrock. So new land is built the way islands are.
SIM.lava = `
uniform sampler2D uS, uL, uRock, uLen, uW; uniform vec4 uBrush; uniform float uBrushR, uTick, uStamp; out vec4 o;
vec4 lavaAt(ivec2 q, out float s){     // a cell's lava once this tick's share has frozen, and the height of its surface
  q = wrap(q, M); vec4 l = texelFetch(uL, q, 0); l.x -= frozen(l, uTick); s = texelFetch(uS, q, 0).x+l.x; return l;
}
// What one cell passes to a lower neighbour: more when hot, and a cooling flow needs a steeper drop to keep moving.
float spill(vec4 from, float drop, float run){ return min(.03*uTick*from.y*from.y*max(drop-(.8-.72*from.y)*run, 0.), .11*from.x); }
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy); vec3 n = decode(gl_FragCoord.xy/N);
  float s, sk; vec4 l = lavaAt(p, s), len = texelFetch(uLen, p, 0);
  float depth = l.x, heat = l.x*l.y;                 // heat as a quantity, so that two flows meeting conserve it
  for(int k=0;k<8;k++){                              // all eight neighbours, or a flow spreads as a diamond
    vec4 m = lavaAt(p+RING[k], sk); float run = len[k>>1];
    float gone = spill(l, s-sk, run), come = spill(m, sk-s, run);
    depth += come-gone; heat += come*m.y-gone*l.y;
  }
  float vent = exp(-6.*R*R*(1.-dot(n, uBrush.xyz))/(uBrushR*uBrushR))*uBrush.w*smoothstep(.4, .75, texelFetch(uRock, p, 0).y);   // fissures along the crests, near the middle of the push
  depth += vent; heat += vent;
  float quench = .0007+.05*smoothstep(.1, .6, texelFetch(uS, p, 0).y)+.003*textureLod(uW, gut(n, NW), 0.).g;   // air, sea, rain
  o = vec4(depth, depth>1e-4 ? clamp(heat/depth-uTick*quench/(.25+depth), 0., 1.) : 0., depth>.15 ? uStamp : l.z, 0.);
}`;

SIM.life = `
uniform sampler2D uS, uC, uW, uLen, uG, uD3; uniform float uSteps, uPeople;
layout(location=0) out vec4 o; layout(location=1) out vec4 oG;
const float FARTHEST = .4*N;                      // as far as anyone will travel, in cells of flat ground
vec4 S(ivec2 q){ return texelFetch(uS, wrap(q, M), 0); }
vec4 C(ivec2 q){ return texelFetch(uC, wrap(q, M), 0); }
float high;                                                                // the sea's surface here at this state of the tide
float fresh(vec4 s){ return step(.03, s.y)*step(high+.3, s.x+s.y); }       // a river or a lake
float salt(vec4 s){ return step(s.x, uSea-.5)*step(.5, s.y); }             // the sea
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy); vec3 n = decode(gl_FragCoord.xy/N); high = uSea+max(tide(n), 0.);
  vec4 s = S(p), sl = S(p+ivec2(-1,0)), sr = S(p+ivec2(1,0)), su = S(p+ivec2(0,1)), sd = S(p+ivec2(0,-1));
  vec4 c = C(p), cl = C(p+ivec2(-1,0)), cr = C(p+ivec2(1,0)), cu = C(p+ivec2(0,1)), cd = C(p+ivec2(0,-1));
  float rain = textureLod(uW, gut(n, NW), 0.).g, T = temperature(n, s.x), dry = step(uSea, s.x)*step(s.y, .3);

  // Ice: snow settles where it is freezing and melts where it is not.
  float ice = clamp(c.x+uSteps*(.004*rain*step(T, 0.)*dry-.0015*max(T, 0.)), 0., 5.);

  // Soil moisture remembers rain over a long time, and seeps outward from rivers and lakes,
  // which is what draws green ribbons through deserts.
  float seep = max(fresh(s), .72*max(max(cl.z, cr.z), max(cu.z, cd.z)));
  float soil = c.z+uSteps*(.0005*(min(rain*3., 1.)-c.z)+.004*max(seep-c.z, 0.));

  // People settle gentle, green, temperate ground and spread from where they already are. How
  // many a place can hold depends above all on water: riverbanks and coasts fill up, the
  // interior stays sparse. Flood, ice or the loss of the forest drives them out.
  float coast = max(max(salt(sl), salt(sr)), max(salt(su), salt(sd)));
  float slope = length(.5*vec2(sr.x-sl.x, su.x-sd.x)/texelFetch(uLen, p, 0).xy);
  float home = dry*step(uSea+uTide.w+.15, s.x)*step(ice, .05)*smoothstep(.15, .5, s.w)*smoothstep(.04, .2, T)*(1.-smoothstep(.2, .5, slope))   // above the highest tide
             * (.3+.7*max(coast, smoothstep(.4, .75, c.z)));
  float around = max(max(cl.y, cr.y), max(cu.y, cd.y));
  vec3 dice = vec3(gl_FragCoord.xy, uTime);        // three rolls: one hash has too few bits for odds this long
  float spark = uPeople*step(.99, hash(dice))*step(.99, hash(dice.yzx+17.))*step(.99, hash(dice.zxy+31.));
  float pop = clamp(c.y+uSteps*(.012*(max(c.y, around)+8.*spark)*max(home-c.y, 0.)-.008*max(c.y-home, 0.)), 0., 1.);
  o = vec4(ice, pop, clamp(soil, 0., 1.), 0.);

  // Roads are rivers of people. Each cell keeps a toll: the effort of reaching somewhere busier
  // than itself by way of its cheapest neighbour. Whoever lives in a cell sets off that way, and
  // the number passing through is the road. Effort is distance, made worse by slopes, water and
  // ice and eased by a road already there, which is what gathers paths into highways. So a
  // pass carved through a range, or a strait closed, redraws the map.
  vec4 len = texelFetch(uLen, p, 0), mine = texelFetch(uG, p, 0);
  float effort = (1.+8.*slope*slope+step(.05, s.y)+6.*step(.05, ice))*(1.-.6*smoothstep(3., 25., mine.y));
  // Somewhere busier: the middle of a town draws its surroundings, and a town in a populous region draws other towns.
  vec2 here = gut(n, N); float town = smoothstep(.02, .3, textureLod(uD3, here, ${Math.log2(N) - 6}.).x);
  float toll = FARTHEST*(1.-.5*town*(1.+smoothstep(0., .1, textureLod(uD3, here, ${Math.log2(N) - 4}.).x))), through = pop, heading = 8.;
  for(int k=0;k<8;k++){
    ivec2 q = p+RING[k]; vec4 g = texelFetch(uG, wrap(q, M), 0);
    float via = g.x+effort*len[k>>1];
    if(via<toll){ toll = via; heading = float(k); }
    // Does that neighbour send its travellers here? Across a fold of the map, its way to us has our way to it, not the opposite.
    if(int(g.z)==((q.x<0 || q.y<0 || q.x>M || q.y>M) ? k : k^1)) through += .995*g.y;
  }
  oG = vec4(toll, min(through, 999.), heading, 0.);
}`;

// Weather. Moisture evaporates from warm sea, rides the wind, and falls wherever air is made to
// rise: at the equator, in storms, and above all on the windward side of mountains, which leaves
// the far side dry. Cloud texture is carried along the same winds.
SIM.weather = `
uniform sampler2D uPrev, uD0, uD3; uniform float uDt, uClock; uniform vec4 uVortex[6]; out vec4 o;
float land(vec3 n){ return max(textureLod(uD0, gut(n, N), 0.).x-uSea, 0.); }
// The winds: easterly trades in the tropics and westerlies beyond, both leaning toward the
// equator; drifting eddies; and a handful of cyclones turning the way their hemisphere demands.
vec3 windAt(vec3 n, out float storm){
  vec3 east = normalize(cross(vec3(0, 1, 0), n)+1e-6), north = cross(n, east);
  float s = n.y;
  vec3 w = east*clamp(4.*s*s-1., -1., 1.)*(1.-s*s*s*s)-north*s*exp(-6.*s*s);
  w += .7*cross(n, noised(n*2.6+uSeed+uClock*.004).yzw);   // the curl of a potential swirls without sources or sinks
  storm = 0.;
  for(int i=0;i<6;i++){
    float close = exp(-60.*(1.-dot(n, uVortex[i].xyz)));
    w += 14.*cross(uVortex[i].xyz, n)*uVortex[i].w*close; storm += abs(uVortex[i].w)*close;
  }
  return w;
}
void main(){
  ivec2 me = wrap(ivec2(gl_FragCoord.xy)-1, MW); vec3 n = decode((vec2(me)+.5)/NW);
  float storm; vec3 wind = windAt(n, storm); float speed = length(wind);
  vec4 was = textureLod(uPrev, gut(normalize(n-wind*uDt), NW), 0.);        // what the wind has carried here
  vec4 g = textureLod(uD0, gut(n, N), 0.);
  float q = was.b, sea = step(g.x, uSea-.2), T = temperature(n, g.x), fire = textureLod(uD3, gut(n, N), 1.).z;
  float ash = clamp(was.a*(1.-.5*uDt)+10.*uDt*fire*fire, 0., 1.);           // an eruption stains the sky downwind

  // Flow noise: the cloud texture is traced back along the wind in two half-offset phases, so it
  // shears into streaks and spirals without ever smearing out.
  float cycle = uClock*.012, grain = 0.;
  for(int k=0;k<2;k++){
    float f = fract(cycle+.5*float(k));
    grain += (1.-abs(2.*f-1.))*fbm(normalize(n-wind*f*.3)*3.5+uSeed+11.*floor(cycle+.5*float(k))+5.*float(k));
  }
  q += uDt*(.7*sea*max(T+.15, 0.)+.15*(1.-sea)*g.z+.8*fire)*(1.-q);   // evaporation; forests breathe a little back; lava boils the sea

  vec3 along = .03*wind/max(speed, 1e-4);
  float rise = land(normalize(n+along))-land(normalize(n-along));            // height gained along the wind
  float belt = exp(-51.*n.y*n.y)-.8*exp(-51.*(abs(n.y)-.47)*(abs(n.y)-.47)); // air rises at the equator and sinks in the horse latitudes
  float slope = .03*max(rise, 0.)*speed, lift = .5*belt+1.6*storm+.3*(1.-smoothstep(-.2, .3, T))+.6*fire;
  float cover = max(smoothstep(.66, 1.1, q+3.*(grain-.5)+.4*lift+.15*slope), .7*smoothstep(.25, 1., ash*(.4+1.2*grain)));
  float rain = clamp(smoothstep(.5, .95, cover)*q*(1.+2.*lift)+.5*q*min(slope, 1.)*smoothstep(.1, .5, cover), 0., 1.);
  o = vec4(cover, rain, clamp(q-uDt*1.2*rain*q, 0., 1.), ash);
}`;

// What the renderer samples: filterable half-float copies of the state, each with its gutter,
// plus the surface normal, taken here at full precision from the neighbours' positions in space.
SIM.derive = `
uniform sampler2D uS, uV, uC, uL; uniform float uStamp;
layout(location=0) out vec4 o0; layout(location=1) out vec4 o1; layout(location=2) out vec4 o2; layout(location=3) out vec4 o3;
vec3 at(ivec2 q){ vec4 s = texelFetch(uS, wrap(q, M), 0); return decode((vec2(q)+.5)/N)*(R+ZS*(s.x+s.y)); }
void main(){
  ivec2 p = wrap(ivec2(gl_FragCoord.xy)-1, M);
  vec4 c = texelFetch(uS, p, 0), life = texelFetch(uC, p, 0), lava = texelFetch(uL, p, 0); vec2 v = texelFetch(uV, p, 0).xy;
  vec3 dx = at(p+ivec2(1,0))-at(p+ivec2(-1,0)), dy = at(p+ivec2(0,1))-at(p+ivec2(0,-1));
  o0 = vec4(c.x, c.y, c.w, length(v));               // bed, water, vegetation, speed
  o1 = vec4(normalize(cross(dy, dx)), c.z);          // normal of the top surface, sediment
  o2 = vec4(.5*(dx*v.x+dy*v.y), life.x);             // current as a vector in space, ice
  // people, soil moisture, how hot the lava is, and how lately it ran: where it did, the rock stays black for an age
  o3 = vec4(life.y, life.z, lava.y*smoothstep(0., .06, lava.x), lava.z>0. ? exp(-.12*max(uStamp-lava.z, 0.)) : 0.);
}`;

// Sun shadow and ambient occlusion for every cell, marched through the heightfield itself, so
// that the screen-space shader never has to cast a shadow ray.
SIM.shadow = `
uniform sampler2D uD0, uG; uniform vec3 uSun; out vec4 o;
float top(vec3 dir){ vec4 c = textureLod(uD0, gut(dir, N), 0.); return R+ZS*(c.x+c.y); }
void main(){
  ivec2 cell = wrap(ivec2(gl_FragCoord.xy)-1, M); vec3 n = decode((vec2(cell)+.5)/N);
  float r0 = top(n), sh = 1., ao = 0., t = 1.;
  vec3 e1 = normalize(cross(n, vec3(.31, .9, .2))), e2 = cross(n, e1);
  for(int i=0;i<8;i++){                              // occlusion: how far the land around stands above this spot
    float a = float(i)*.785+.3, reach = (i&1)==0 ? 3. : 9.;
    ao += max(top(normalize(n*R+(e1*cos(a)+e2*sin(a))*reach))-r0, 0.)/reach;
  }
  if(dot(n, uSun)>-.2){
    vec3 from = n*(r0+.15);
    for(int i=0;i<30;i++){
      vec3 q = from+uSun*t; float r = length(q);
      sh = min(sh, .55+10.*(r-top(q/r))/t);          // clearance angle → penumbra
      t += .8+.09*t;
      if(r>R+ZS*HMAX) break;
    }
  }
  o = vec4(clamp(sh, 0., 1.), clamp(1.-.5*ao/ZS, .25, 1.), smoothstep(5., 40., texelFetch(uG, cell, 0).y), 1);   // and how busy the road is here
}`;

const TRACE = `
uniform sampler2D uD0; uniform vec3 uRo, uCr, uCu, uCf; uniform vec2 uRes;
vec3 viewRay(){ vec2 s = (gl_FragCoord.xy*2.-uRes)/uRes; return normalize(uCf+uCr*s.x+uCu*s.y); }
vec2 sphere(vec3 ro, vec3 rd, float r){            // where a ray enters and leaves a sphere about the origin
  float b = dot(ro, rd), h = b*b-dot(ro, ro)+r*r;
  if(h<0.) return vec2(FAR, -FAR);
  h = sqrt(h); return vec2(-b-h, -b+h);
}
float top(vec3 dir){ vec4 c = textureLod(uD0, gut(dir, N), 0.); return R+ZS*(c.x+c.y); }
// March against the displaced sphere. Talus erosion bounds the terrain's slope, so a fixed
// fraction of the height above ground is always a safe step; once a step lands underground,
// bisection pins the hit. Nothing wet lies below the sea at its lowest ebb, so the march ends there.
bool scene(vec3 ro, vec3 rd, out float t){
  vec2 shell = sphere(ro, rd, R+ZS*HMAX); t = max(shell.x, 0.);
  if(shell.y<t) return false;
  float sea = sphere(ro, rd, R+ZS*(uSea-.5*uTide.w)-.01).x, end = min(shell.y, sea>0. ? sea : FAR), tp = t;   // the sea at its lowest ebb
  for(int i=0;i<96;i++){
    vec3 p = ro+rd*t; float r = length(p), dy = r-top(p/r);
    if(dy<0.){
      float a = tp, b = t;
      for(int j=0;j<5;j++){ t = .5*(a+b); p = ro+rd*t; if(length(p)<top(normalize(p))) b = t; else a = t; }
      return true;
    }
    tp = t; t += max(dy*.7, .003*t);
    if(t>end){ t = sea; return sea>0. && sea<FAR; }
  }
  return true;                                       // out of steps while skimming the ground: as good as a hit
}`;

// A few pixels of ground truth for the CPU: where the pointer's ray lands, the state under the
// brush, and what lies under the centre of the view.
SIM.pick = TRACE + `
uniform sampler2D uW, uD3; uniform vec3 uRd, uProbe, uLook; out vec4 o;
void main(){
  float t;
  if(gl_FragCoord.x<1.){ bool hit = scene(uRo, uRd, t); o = vec4(uRo+uRd*t, hit ? 1. : 0.); }
  else if(gl_FragCoord.x<2.) o = textureLod(uD0, gut(uProbe, N), 0.);
  else {
    bool hit = scene(uRo, uLook, t); vec3 d = normalize(uRo+uLook*t); vec4 c = textureLod(uD0, gut(d, N), 0.);
    if(!hit) o = vec4(0.);
    else if(gl_FragCoord.x<3.) o = vec4(c.x-uSea, c.z, textureLod(uW, gut(d, NW), 0.).g, 1.);
    else o = textureLod(uD3, gut(d, N), 3.);         // people and fire thereabouts
  }
}`;

// The atmosphere: Rayleigh and Mie scattering in air whose density falls off exponentially with
// height. Depth toward the sun has a closed form (Schüler's fit to the Chapman function), so the
// only loop is the one along the view ray.
const SKY = `
uniform vec3 uSun; uniform vec4 uFlash[4], uMoon;   // uMoon: where the moon is, and how much light it sends
const float HR = .012*R, HM = .005*R, RA = 1.085*R, SUNC = 5.5, RC = R+ZS*9., TC = ZS*8.;   // scale heights; top of the air; sun; cloud base and depth
const vec3 BR = vec3(.045, .105, .24)/HR; const float BM = .03/HM;                          // scattering per unit length at sea level
const float RM = ${MOON_R}*R; const vec3 MOONC = vec3(.14, .19, .3);                         // the moon's size; the colour of its light
// The moon's shadow is a column pointing away from the sun: dark at the core, full light at the edge.
float eclipse(vec3 p){
  vec3 d = p-uMoon.xyz; float along = dot(d, uSun);
  return along>0. ? 1. : smoothstep(.5*RM, 1.35*RM, length(d-uSun*along));
}
float chapman(float x, float mu){ float c = sqrt(1.5708*x); return c/((c-1.)*mu+1.); }
float depthToSun(float r, float mu, float H){      // r = distance from the centre, mu = cosine of the sun's zenith angle there
  float x = r/H, rho = exp((R-r)/H);
  if(mu>=0.) return H*rho*chapman(x, mu);
  float x0 = x*sqrt(max(1.-mu*mu, 0.)), graze = R/H-x0;     // the sun is below the horizon: its ray dips to x0 before it climbs to us
  return H*(2.*exp(min(graze, 3.))*sqrt(1.5708*x0)-rho*chapman(x, -mu)+200.*smoothstep(0., 1.5, graze));   // …or into the ground
}
vec3 sunAt(float r, float mu){ return SUNC*exp(-BR*depthToSun(r, mu, HR)-BM*depthToSun(r, mu, HM)); }
// A stand-in for the sky as seen from the ground, for ambient light and reflections in water.
// mu = the sun's height there, up = how far above the horizon we look, toward = how nearly sunward.
vec3 dome(float mu, float up, float toward){
  float day = smoothstep(-.12, .25, mu), dusk = smoothstep(-.2, .02, mu)*(1.-smoothstep(.05, .45, mu));
  vec3 zen = mix(vec3(.004, .007, .016), vec3(.06, .18, .48), day);
  vec3 hor = mix(vec3(.01, .014, .025), vec3(.45, .6, .82), day)+dusk*vec3(.9, .38, .12)*(.35+.65*toward);
  return mix(hor, zen, 1.-exp(-3.*max(up, 0.)));
}
vec3 flashes(vec3 dir, float tight){               // lightning
  float f = 0.; for(int i=0;i<4;i++) f += uFlash[i].w*exp(-tight*(1.-dot(dir, uFlash[i].xyz)));
  return f*vec3(.6, .7, 1.);
}`;

// The air between the eye and the ground, at a third of the picture's size: haze is smooth, and
// survives upscaling. Outputs the light scattered toward the eye, how much of what lies behind
// survives, and the depth it stopped at, which lets the full-size picture upsample without halos.
const AIR = TRACE + SKY + `
layout(location=0) out vec4 oGlow; layout(location=1) out vec4 oPass;
void main(){
  vec3 rd = viewRay(), glow = vec3(0), pass = vec3(1);
  float tEnd; if(!scene(uRo, rd, tEnd)) tEnd = FAR;
  tEnd = min(tEnd, FAR);
  // Single scattering along the ray. The air is densest at the ray's lowest point, so the ray is
  // split there and each half is sampled more finely toward it.
  vec2 a = sphere(uRo, rd, RA); float ta = max(a.x, 0.), tb = min(tEnd, a.y);
  if(tb>ta){
    float mu0 = dot(rd, uSun), low = clamp(-dot(uRo, rd), ta, tb);
    float pr = .0597*(1.+mu0*mu0), pm = .0504*(1.+mu0*mu0)/(2.5776*pow(1.5776-1.52*mu0, 1.5));   // Rayleigh; Mie (Cornette–Shanks, g = 0.76)
    for(int k=0;k<2;k++){
      float len = k==0 ? low-ta : tb-low;
      for(float i=.5; i<7. && len>0.; i++){
        float x = k==0 ? 1.-i/7. : i/7., dt = 2.*len*x/7.;
        vec3 p = uRo+rd*(low+(k==0 ? -len : len)*x*x); float r = length(p), mu = dot(p, uSun)/r;
        float dR = exp((R-r)/HR)*dt, dM = exp((R-r)/HM)*dt;
        glow += pass*exp(-BR*depthToSun(r, mu, HR)-BM*depthToSun(r, mu, HM))*(BR*dR*pr+BM*dM*pm)*SUNC*1.6*eclipse(p);
        pass *= exp(-BR*dR-BM*dM);
      }
    }
  }
  oGlow = vec4(glow, tEnd); oPass = vec4(pass, 1.);
}`;

const RENDER = TRACE + SKY + `
uniform sampler2D uD1, uD2, uD3, uSh, uW, uAir, uAirPass;
uniform vec4 uBrush, uCraft[10]; uniform float uBrushR, uBase; uniform vec2 uTurn;
out vec4 o;
vec3 tangent(vec3 v, vec3 up){ return v-up*dot(v, up); }   // the part of v that lies along the ground

// Cubic B-spline filtering from four bilinear taps (Sigg & Hadwiger). When one cell of the map
// covers many pixels, bilinear filtering shows its creases; this rounds them off. It needs two
// cells of margin and the gutter is one, so toward the map's edge it hands back to bilinear.
vec4 soft(sampler2D s, vec2 uv, float amount){
  vec4 plain = textureLod(s, uv, 0.);
  vec2 size = vec2(textureSize(s, 0)), x = uv*size-.5, f = fract(x), i = floor(x);
  amount *= smoothstep(1., 2.5, min(min(x.x, x.y), min(size.x-1.-x.x, size.y-1.-x.y)));
  if(amount<=0.) return plain;
  vec2 w0 = (1.-f)*(1.-f)*(1.-f)/6., w1 = (3.*f*f*f-6.*f*f+4.)/6., g0 = w0+w1, g1 = 1.-g0;
  vec2 a = (i+w1/g0-.5)/size, b = (i+f*f*f/(6.*g1)+1.5)/size;
  return mix(plain, g0.y*(g0.x*textureLod(s, a, 0.)+g1.x*textureLod(s, vec2(b.x, a.y), 0.))

}
// Relief finer than the grid can hold is drawn as bumps: octaves of noise that lean the normal

vec4 octave(vec3 q){ vec4 n = noised(OCT*q); return vec4(n.x, .5*n.yzw*OCT); }   // noise in a turned frame, so octaves do not line up

vec3 shade(vec3 p, vec3 rd, float t){

  float flatness = dot(nrm, up), slope = sqrt(max(1.-flatness*flatness, 0.))/max(flatness, .2)/ZS, steep = smoothstep(.5, 1., slope);
  float night = 1.-smoothstep(-.15, .1, mu);

  float overhead = textureLod(uW, gut(normalize(p+uSun*(RC+.5*TC-r)/max(mu, .15)), NW), 0.).r;
  float ecl = eclipse(p), dim = .1+.9*ecl;          // inside the moon's shadow the sun goes out and the sky dims with it
  vec3 sun = sunAt(r, mu)*sh.x*(1.-.8*smoothstep(.15, .75, overhead))*ecl;
  vec3 ambient = mix(dome(mu, 0., .5)*.45, dome(mu, 1., .5), .5+.5*dot(nrm, up))*sh.y*dim+vec3(.0015, .002, .004);
  // Moonlight: a second, far weaker sun, which is what makes the night side a place and not a silhouette.
  vec3 md = normalize(uMoon.xyz);
  vec3 moonlight = MOONC*uMoon.w*smoothstep(-.1, .25, dot(up, md))*(1.-.6*smoothstep(.35, .85, textureLod(uW, gut(up, NW), 0.).r))*sh.y;

  // Ground. Strata are a function of height alone, so rivers cut down through visible layers.
  // Climate chooses the rest: sand or loam, savanna or rainforest or taiga, snow.
  vec4 n1 = noised(p*.31+uSeed), n2 = noised(p*1.7), n3 = vec4(.5, 0, 0, 0), n4 = n3;
  float w2 = 1.-smoothstep(.2, .5, px*1.7), w3 = 1.-smoothstep(.2, .5, px*4.6), w4 = 1.-smoothstep(.2, .5, px*12.);   // an octave fades before it is finer than a pixel
  if(w3>0.) n3 = octave(p*2.3+3.);

  float canopy = smoothstep(.3, .62, veg+.35*(n2.x-.5))*(1.-.85*steep);
  float band = .65*noise(vec3(b*.7+4.*n1.x, uSeed.x, 0.))+.35*noise(vec3(b*1.9+7.*n1.x, uSeed.y, 0.));
  vec3 rockc = mix(vec3(.15, .115, .095), vec3(.34, .25, .17), smoothstep(.3, .7, band));
  rockc = mix(mix(rockc, vec3(.4, .2, .11)*(.55+.9*band), .65*arid), vec3(.24, .24, .26)*(.6+.8*band), .7*cold);
  float tone = .55+.5*noise(p*.07+uSeed)+.3*(n1.x-.5)+.25*(n2.x-.5)+.2*w3*(n3.x-.5);
  vec3 soilc = mix(vec3(.17, .125, .075), mix(vec3(.42, .26, .13), vec3(.5, .38, .22), noise(p*.021+uSeed.zxy)), arid)*tone;
  vec3 alb = mix(soilc, rockc, .15+.85*steep);
  alb = mix(alb, vec3(.56, .48, .34)*(.85+.3*n2.x), (1.-smoothstep(.5, 2.8, h))*(1.-steep));       // sand by the sea, and under it
  vec3 leaf = mix(vec3(.13, .19, .05), vec3(.035, .09, .025), smoothstep(.5, 1., veg+.3*(n1.x-.5)));
  leaf = mix(mix(leaf, vec3(.27, .24, .08), .75*arid), vec3(.05, .09, .06), .8*cold);

  float molten = life.z, basalt = life.w;
  alb = mix(alb, vec3(.045, .04, .042)*(.5+n2.x), basalt);

  if(farm>0.){

  alb *= 1.-.45*clamp(smoothstep(0., .05, d)+d*4., 0., 1.);                                        // wet ground is darker
  // Fine relief: rock grain and gullies, a bumpy canopy where it is wooded, dunes on open sand.
  float bare = (1.-canopy)*(1.-snow), rocky = bare*max(max(steep, .5*cold), basalt), sandy = bare*arid*(1.-steep)*smoothstep(.3, 1.5, h);
  vec4 bumps = w2*.45*mix(.4+.4*steep, 1.6, canopy)*relief(n2, rocky)+w3*.4*mix(.5+.5*steep, 1.3, canopy)*relief(n3, rocky)+w4*.3*relief(n4, rocky);
  if(sandy>.02 && w2>0.){
    vec4 dune = noised(p*vec3(.45, 1.5, .45)+uSeed.zxy+1.6*n1.x);   // stretched, so its crests run in lines; warped, so they wander
    bumps = mix(bumps, bumps*.4+.7*w2*vec4(sign(dune.x-.5)*dune.yzw*vec3(.3, 1., .3), abs(2.*dune.x-1.)-.5), sandy*smoothstep(.2, .6, noise(p*.05+uSeed)));
  }
  alb *= 1.-.7*bumps.w*(1.-.7*snow);
  vec3 n = normalize(up+tangent(nrm, up)*.6/ZS+tangent(n1.yzw, up)*.3*(1.-.6*canopy)*(1.-.5*sandy)+tangent(bumps.xyz, up)*(1.-.8*snow));   // slopes exaggerated, as on a relief map
  vec3 col = alb*(sun*max(dot(n, uSun), 0.)+ambient+flashes(up, 3000.))+mix(vec3(dot(alb, vec3(.3, .5, .2))), alb, .3)*moonlight*max(dot(n, md), 0.);   // by moonlight the eye loses colour
  if(molten>.003){
    // Lava gives its own light. As it cools a crust closes over it, and the glow retreats into the cracks.
    float plate = mix(noise(OCT*p*.8+1.3*n2.yzw), n3.x, .35*w3), seam = 1.-smoothstep(0., .03+.05*molten, abs(plate-.62));
    float open = max(smoothstep(-.12, .12, .95*molten-.25-1.25*plate), seam*smoothstep(.1, .3, molten));
    col = col*(1.-.85*smoothstep(0., .2, molten))+(vec3(1., .26, .03)*pow(molten, 1.5)+vec3(.45, .3, .1)*pow(molten, 5.))*(3.2-1.8*plate)*open;
  }

  float wet = smoothstep(.008, .06, d);
  if(wet>0.){
    // Wind ripples ride on the simulated surface, whose own slope carries the swells and wakes.
    float calm = 1./(1.+t*.004);
    vec3 rip = .13*noised(p*.13+uTime*vec3(.2, .12, .1)).yzw+.12*calm*noised(p*.4-uTime*vec3(.3, .4, .2)).yzw;
    vec4 chop = vec4(.5, 0, 0, 0);                    // up close, wind wrinkles, drawn out along their crests
    if(w3>0.){ chop = octave(p*vec3(1.2, .5, 1.2)+uTime*vec3(.4, -.3, .35)); rip += .09*w3*chop.yzw; }

    float fres = .02+.98*pow(1.-max(dot(-rd, wn), 0.), 5.), fn0 = noise(p*.7+uTime*vec3(.2, .1, .15));
    vec3 rr = reflect(rd, wn);
    vec3 refl = dim*dome(mu, abs(dot(rr, up))+.02, .5+.5*dot(normalize(tangent(rr, up)+1e-5), normalize(tangent(uSun, up)+1e-5)));

    // go blue. Sediment in suspension turns the water opaque and brown.
    float silt = min(g.w*22., 1.), path = d/max(dot(-rd, up), .3);
    vec3 ext = exp(-path*mix(vec3(2., .55, .36), vec3(1.8, 2.2, 2.8), silt));
    vec3 inLight = sun*max(mu, 0.)*.45+dome(mu, .6, .5)*.9*dim+moonlight*.4;
    vec3 w = mix(col*ext+mix(vec3(.002, .035, .06), vec3(.3, .21, .11), silt)*inLight*(1.-ext), refl, fres);
    w *= 1.+(1.2*dot(tangent(rip, up), uSun)+.22*w3*(chop.x-.5))*smoothstep(0., 1.2, d);   // faces of waves that lean toward the sun are brighter

// The cloud layer is a thin shell crossed in four steps. Thicker cover towers higher, and one
// tap toward the sun shades it. Returns light (already weighted by opacity) and opacity.
float coverAt(vec3 dir){ return textureLod(uW, gut(dir, NW), 0.).r; }
vec4 clouds(vec3 ro, vec3 rd, float tEnd){
  vec2 outer = sphere(ro, rd, RC+TC), inner = sphere(ro, rd, RC);
  if(outer.x<=0. || outer.x>=tEnd) return vec4(0.);
  float tb = min(inner.x>0. && inner.x<FAR ? inner.x : outer.y, tEnd), dt = (tb-outer.x)/4., alpha = 0., lit = 0., soot = 0.;
  float fine = 1.-smoothstep(.25, .6, outer.x*2.*length(uCu)/uRes.y);   // extra detail, only when close enough to resolve it
  vec3 entry = normalize(ro+rd*outer.x), sunward = normalize(tangent(uSun, entry)+1e-4);
  for(float i=.5; i<4.; i++){
    vec3 p = ro+rd*(outer.x+i*dt); float r = length(p); vec3 dir = p/r; vec4 sky = textureLod(uW, gut(dir, NW), 0.);
    float h = (r-RC)/TC, cover = sky.r;
    if(cover<.03) continue;
    vec4 heap = vec4(.5, 0, 0, 0);                   // up close the cover breaks into heaps: noise, with its gradient for shading
    if(fine>0.){
      vec3 q = p*.25+uTime*.015; vec4 m = noised(OCT*q+5.), k = noised(OCT*OCT*q+9.);
      heap = mix(heap, .57*noised(q)+.29*vec4(m.x, m.yzw*OCT)+.14*vec4(k.x, k.yzw*OCT*OCT), fine);
    }
    float a = (1.-alpha)*(1.-exp(-smoothstep(.1+.25*fine, .8-.25*fine, 1.25*cover-(1.-heap.x)-.45*h*(1.6-cover)+.05)*dt*.5/ZS));
    // One tap toward the sun for the shadow of the cloud beyond; the heap's own slope for its lit and dark sides.
    lit += a*exp(-2.5*coverAt(normalize(p+sunward*TC*2.))*(1.-.6*h))*clamp(.8-1.1*dot(heap.yzw, sunward), .3, 1.25); alpha += a; soot += a*sky.a;
  }
  float mu = dot(entry, uSun), facing = dot(entry, -rd), ecl = eclipse(entry*RC);
  vec3 col = sunAt(RC+.5*TC, mu)*ecl*(.15*alpha+.85*lit)*.45+(dome(mu, 1., .5)*.55*(.1+.9*ecl)+flashes(entry, 1200.)*3.)*alpha;
  col += MOONC*uMoon.w*alpha*(.1+.3*max(dot(entry, normalize(uMoon.xyz)), 0.));   // cloud tops by moonlight
  // Ash darkens a cloud, and the fire under it lights it from below.
  col = col*mix(vec3(1.), vec3(.3, .26, .25), soot/max(alpha, 1e-4))+vec3(1., .3, .06)*.3*alpha*textureLod(uD3, gut(entry, N), 3.).z;
  // Seen through the air above it: toward the limb that path is long, and the cloud goes blue.
  vec3 above = exp(-BR*depthToSun(RC+.5*TC, facing, HR)-BM*depthToSun(RC+.5*TC, facing, HM));
  col = col*above+(1.-above)*dome(mu, .25, .5)*1.4*alpha;
  return vec4(col, alpha)*smoothstep(.03, .3, facing);   // edge-on at the limb the layer is thinner than a pixel
}

// Aurora: a thin, wavering curtain round each magnetic pole, high over the night side. Three
// shells give it height when seen edge-on at the limb: green below, red above.
vec3 aurora(vec3 ro, vec3 rd, float tEnd){
  vec3 pole = vec3(.167, .982, .098), e1 = normalize(cross(pole, vec3(1, 0, 0))), e2 = cross(pole, e1), sum = vec3(0.);
  for(float k=0.; k<3.; k++){
    float t = sphere(ro, rd, R*(1.045+.018*k)).x;
    if(t<=0. || t>=tEnd) continue;
    vec3 dir = normalize(ro+rd*t); float dark = 1.-smoothstep(-.35, -.1, dot(dir, uSun)), m = abs(dot(dir, pole));
    if(dark<=0. || m<.8) continue;
    vec2 along = normalize(vec2(dot(dir, e1), dot(dir, e2))+1e-5);          // position along the ring
    float off = m-.9-.035*(noise(vec3(along*1.3, uTime*.05+k*.15))-.5)-.012*(noise(vec3(along*5., uTime*.1))-.5);
    float rays = noise(vec3(along*26., uTime*.4));
    sum += mix(vec3(.1, 1., .4), vec3(.8, .15, .5), k*.5)*exp(-6000.*off*off)*(.3+1.7*rays*rays)*dark/max(dot(dir, -rd), .2);
  }
  return sum*.12;
}

// The moon. Craters of three sizes sit in the cells of a grid that its surface cuts through, over
// dark seas of old lava. The sun gives it phases, the planet's own glow fills in its night side,
// and in the planet's shadow the only light to reach it has passed through every sunset on the
// planet at once. It keeps one face turned to the planet; later, that face may not stay dark.
vec3 turn(vec3 v){ return vec3(v.x*uTurn.x-v.z*uTurn.y, v.y, v.x*uTurn.y+v.z*uTurn.x); }
vec4 crater(vec3 g){                               // xyz: which way the ground falls; w: paler rim, darker floor
  vec3 id = floor(g), c = id+.5+.5*(vec3(hash(id+1.7), hash(id+5.3), hash(id+9.1))-.5);
  float k = hash(id), d = length(g-c)/(.2+.28*k);
  if(k<.4 || d>1.7) return vec4(0.);
  float lip = exp(-14.*(d-1.)*(d-1.));
  return vec4(normalize(g-c+1e-5)*(d<1. ? 1.6*d : -1.8*lip), .3*lip-.1*(1.-smoothstep(.5, 1., d)));
}
vec3 moon(vec3 rd, float t){
  vec3 at = uRo+rd*t, q = turn((at-uMoon.xyz)/RM), s = turn(uSun), home = turn(-normalize(uMoon.xyz));
  vec4 dents = crater(q*3.)+.7*crater(q*7.+3.)+.5*crater(q*17.+8.);
  float alb = mix(.3, .12, smoothstep(.42, .6, fbm(q*1.7+uSeed*.013)))*(1.+dents.w)*(.8+.4*noise(q*30.));
  float along = dot(at, uSun), sunlit = along>0. ? 1. : smoothstep(.92*R, 1.2*R, length(at-uSun*along));
  float lit = pow(max(dot(normalize(q-.55*tangent(dents.xyz, q)), s), 0.), .75), facing = max(dot(q, home), 0.);
  vec3 col = alb*(SUNC*.5*vec3(1., .97, .92)*lit*sunlit+vec3(.8, .2, .06)*.45*lit*(1.-sunlit)
                 +vec3(.012, .02, .035)*(.5+.5*dot(normalize(uMoon.xyz), uSun))*facing);
  float site = exp(-(1.-dot(q, home))*700./(.25+uBase))*smoothstep(.55, .8, noise(q*150.));
  return col+vec3(1., .75, .45)*4.*uBase*site*(1.-lit*sunlit);
}

vec3 space(vec3 rd){
  float tm = sphere(uRo-uMoon.xyz, rd, RM).x;
  if(tm>0. && tm<FAR) return moon(rd, tm);
  // One star in some cells of a grid that the sky's sphere cuts through.
  vec3 q = rd*110., id = floor(q); float k = hash(id);
  vec3 off = fract(q)-.5-.6*(vec3(hash(id+1.7), hash(id+5.3), hash(id+9.1))-.5);
  vec3 col = vec3(.8, .88, 1.)*step(.92, k)*(k-.91)*40.*(1.-smoothstep(0., .14, length(off)));
  float band = dot(rd, vec3(.3, .8, -.52));
  col += vec3(.5, .55, .8)*.02*exp(-20.*band*band)*(.4+noise(rd*6.)+.5*noise(rd*17.));   // the galaxy
  float s = dot(rd, uSun);
  return col+SUNC*vec3(1., .95, .9)*(9.*smoothstep(.99996, .99999, s)+.05*pow(max(s, 0.), 4000.));
}

// Ships and satellites are points of light: each adds a glint wherever the ray passes close by,
// unless the planet is in the way. Warm ones are under power; cold ones only catch the sun.
vec3 craft(vec3 rd, float depth){
  vec3 sum = vec3(0.);
  for(int i=0;i<10;i++){
    vec3 to = uCraft[i].xyz-uRo; float along = dot(to, rd), w = uCraft[i].w;
    if(w==0. || along<0. || along>depth) continue;
    float size = along*3.*length(uCu)/uRes.y, d = (dot(to, to)-along*along)/(size*size);
    sum += (w>0. ? vec3(1., .7, .4) : vec3(.8, .9, 1.))*abs(w)*(exp(-d)+.05/(1.+d));
  }
  return sum;
}

void main(){
  vec3 rd = viewRay(); float t; bool hit = scene(uRo, rd, t);
  vec3 col = hit ? shade(uRo+rd*t, rd, t) : space(rd);
  // The air layer is a third of this size. For a pixel on the ground, favour those of its four
  // nearest texels whose march stopped at a similar depth, so haze behind a ridge does not smear
  // across its edge. A pixel of open space takes them all, which keeps the limb smooth.
  ivec2 size = textureSize(uAir, 0); float depth = hit ? min(t, FAR) : FAR, total = 0.;
  vec2 q = gl_FragCoord.xy*vec2(size)/uRes-.5, fr = fract(q); vec3 glow = vec3(0), pass = vec3(0);
  for(int k=0;k<4;k++){
    ivec2 dq = ivec2(k&1, k>>1), at = clamp(ivec2(floor(q))+dq, ivec2(0), size-1);
    vec4 a = texelFetch(uAir, at, 0);
    float w = (dq.x==1 ? fr.x : 1.-fr.x)*(dq.y==1 ? fr.y : 1.-fr.y)/(.12+(hit ? abs(a.a/depth-1.) : 0.));
    glow += w*a.rgb; pass += w*texelFetch(uAirPass, at, 0).rgb; total += w;
  }
  vec4 cl = clouds(uRo, rd, depth);
  o = vec4((col*pass+glow)/max(total, 1e-6)*(1.-cl.a)+cl.rgb+aurora(uRo, rd, depth)+craft(rd, depth), hit ? t : 0.);   // depth 0 marks space
}`;

const POST = {};
// Shared by every bloom pass: a 4-tap box whose taps sit between texels, so each is itself a 2×2 average.
POST.blur = `
uniform sampler2D uT; uniform vec2 uRes; uniform float uSpread, uKnee; out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy/uRes, d = uSpread/uRes;
  vec3 c = .25*(texture(uT, uv+d).rgb+texture(uT, uv-d).rgb+texture(uT, uv+vec2(d.x,-d.y)).rgb+texture(uT, uv+vec2(-d.x,d.y)).rgb);
  if(uKnee>0.){ float l = max(c.r, max(c.g, c.b)); c = min(c*max(l-uKnee, 0.)/max(l, 1e-4), vec3(30.)); }
  o = vec4(c, 1);

// The lens: close to the ground a shallow depth of field (which is what makes the land read as a
// model you could touch), then bloom, exposure, filmic tone curve and grade. Luma goes to alpha
// for anti-aliasing.
POST.lens = `
uniform sampler2D uScene, uBloom; uniform vec2 uRes; uniform float uExposure, uFocus, uBlur; out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy/uRes; vec4 c = texture(uScene, uv); vec3 col = c.rgb;
  float coc = c.a>0. ? uBlur*clamp(abs(uFocus/c.a-1.)*1.5-.15, 0., 1.)*min(uRes.x, uRes.y)/220. : 0.;
  if(coc>.5){
    for(int i=0;i<8;i++){   // golden-angle disc

  float l = dot(col, vec3(.2126,.7152,.0722));

  col = mix(col, col*vec3(1.05,1.,.93), smoothstep(.45, 1., l));               // warm highlights
  col = pow(col, vec3(1./2.2));

POST.present = `
uniform sampler2D uImg; uniform vec2 uRes, uSrc; uniform float uTime, uVeil; out vec4 o;
float hash(vec2 p){ vec3 q = fract(p.xyx*.1031); q += dot(q, q.yzx+33.33); return fract((q.x+q.y)*q.z); }

  float lo = min(lM, min(min(lNW,lNE), min(lSW,lSE))), hi = max(lM, max(max(lNW,lNE), max(lSW,lSE)));
  vec2 dir = vec2(lSW+lSE-lNW-lNE, lNW+lSW-lNE-lSE);
  dir = clamp(dir/(min(abs(dir.x), abs(dir.y))+max((lNW+lNE+lSW+lSE)*.03, .008)), -8., 8.)*px;
  vec4 a = .5*(texture(uImg, uv-dir/6.)+texture(uImg, uv+dir/6.));
  vec4 b = .5*a+.25*(texture(uImg, uv-dir*.5)+texture(uImg, uv+dir*.5));

  float gr = hash(gl_FragCoord.xy+fract(uTime*7.31)*vec2(311.,173.))+hash(gl_FragCoord.yx+fract(uTime*5.17)*vec2(97.,211.))-1.;

const P = { air: program(HEAD + AIR), render: program(HEAD + RENDER) };
for (const k in SIM) P[k] = program(HEAD + SIM[k]);
for (const k in POST) P[k] = program(LEAN + POST[k]);

// ───────────────────────────────────────────────────────────── the planet's textures
const G = N + 2, TOP = Math.floor(Math.log2(G));                       // size with gutter; index of the 1×1 mip
const simTex = () => texture(N, N, SIMF, gl.NEAREST);
const stateA = simTex(), stateB = simTex(), velocity = simTex();
const rock = texture(N, N, gl.RGBA16F, gl.NEAREST), lengths = texture(N, N, gl.RGBA16F, gl.NEAREST);
let fluxes = [target(simTex()), target(simTex())], lives = [0, 1].map(() => target(simTex(), simTex()));   // lives: life, and the roads it makes
let lavas = [0, 1].map(() => target(texture(N, N, gl.RGBA16F, gl.NEAREST)));
let weather = [0, 1].map(() => target(texture(NW + 2, NW + 2, gl.RGBA16F, gl.LINEAR, true)));
weather.forEach(w => { w.forecast = peek(w.tex, 5); });                // the 16×16 mip: a forecast the CPU can afford to read
const toStateA = target(stateA), toFlow = target(stateB, velocity), toBedrock = target(rock, lengths);
const D = [0, 1, 2, 3].map(i => texture(G, G, gl.RGBA16F, gl.LINEAR, i !== 1)), toDerived = target(...D);
const means = [0, 2, 3].map(i => peek(D[i], TOP));                     // a map's 1×1 mip is the planet's average
const towns = peek(D[3], TOP - 5);                                     // …and its 32×32 mip is a gazetteer
const toShadow = target(texture(G, G, gl.RGBA8, gl.LINEAR)), toPick = target(texture(4, 1, SIMF, gl.NEAREST));

// ───────────────────────────────────────────────────────────── world state
let seed = parseInt(location.hash.slice(1), 36);
if (!(seed > 0)) seed = 1 + Math.floor(Math.random() * 36 ** 4);
let seedVec, started = false, idle = 0, frameCount = 0, warmup = 0, stepDebt = 0;
const world = { time: 0, clock: 0, age: 0, dt: 0, pace: 1, far: 1, sea: 0, warm: 1,
  h: 0, water: 0, speed: 0, meanH: 0, meanSpeed: 0, meanIce: 0, land0: null, ice0: null, people: 0, fire: 0, molten: 0, capital: null, city: 0 };
const look = { h: 0, veg: 0, rain: 0, people: 0, fire: 0, hit: false, dir: [0, 0, 1], range: R };   // what lies under the centre of the view, and how far off
const stamp = () => 1 + world.clock / 16;       // the date, as the lava map records it
const brush = { dir: [0, 0, 1], target: [0, 0, 1], s: 0, radius: 20, glow: 0, vent: 0 };
const cam = { az: 0, lat: .3, dist: 4.7 * R, azT: 0, latT: .3, distT: 4.7 * R, drift: 1, tanV: .29 };
const sun = { angle: 0, dir: [0, 0, 1] };
const moon = { angle: 0, dir: [0, 0, 1], pos: [0, 0, MOON_D], light: 0, base: 0 };
const globals = () => ({ uTime: world.time, uSea: world.sea, uWarm: world.warm, uSeed: seedVec, uTide: [...moon.dir, TIDE] });
const eye = () => ({ ...globals(), uD0: D[0], uRo: cam.pos, uCr: cam.r, uCu: cam.u, uCf: cam.f });

function newWorld(s) {
  seed = s;
  try { history.replaceState(null, '', '#' + seed.toString(36)); } catch (e) {}
  seedVec = [(seed % 997) * .731, (Math.floor(seed / 997) % 991) * .517, (seed % 89) * 1.37];
  Object.assign(world, { clock: 0, age: 0, sea: 0, warm: 1, land0: null, ice0: null });
  draw(P.bedrock, toBedrock, globals());
  const wipe = (list, ...rgba) => list.forEach(t => { gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo); gl.clearColor(...rgba); gl.clear(gl.COLOR_BUFFER_BIT); });
  wipe(fluxes, 0, 0, 0, 0); wipe(lives, 0, 0, 0, 0); wipe(lavas, 0, 0, 0, 0); wipe(weather, 0, 0, .5, 0);
  const fresh = target(stateA, lives[0].tex);
  draw(P.init, fresh, globals()); gl.deleteFramebuffer(fresh.fbo);
  sun.angle = seed % 6;
  cam.az = cam.azT = sun.angle + 1.15;         // open on a gibbous planet, the terminator in view
  moon.angle = cam.az + Math.PI - .62; moon.base = 0;   // …and the moon beyond its night side, about to set behind it
  Object.assign(voyage, { t: -1, next: 0, count: 0, ripe: 0 });
  warmup = 240;                                // extra steps on a fresh world, so its first rivers are already cut when the veil lifts
}

// Time runs faster the further back you stand: ages from orbit, an afternoon up close.
function updateTime(dt) {
  world.far = smooth(NEAR, .8 * FARD, cam.dist);
  world.pace = (1 + 5 * world.far ** 2) * (keys.t ? 10 : 1);
  const t = world.dt = dt * world.pace;
  world.time += dt; world.clock += t; world.age += t;
  sun.angle += t * 2 * Math.PI / 300;
  sun.dir = norm([Math.sin(sun.angle), .2, Math.cos(sun.angle)]);       // the axis leans a little toward the sun
  // The moon circles more slowly, in a plane that holds the sun and wobbles a little about it. So
  // each time the sun overtakes it, its shadow crosses the planet somewhere, and half a lap later
  // it passes through the planet's shadow instead. Its light is the lit share of the face we see.
  moon.angle += t * 2 * Math.PI / 514;
  moon.dir = norm([Math.sin(moon.angle), .2 * Math.cos(moon.angle - sun.angle) + .1 * Math.sin(world.clock * 2 * Math.PI / 2900 - 1), Math.cos(moon.angle)]);
  moon.pos = scale(moon.dir, MOON_D);
  const along = dot(moon.pos, sun.dir), aside = Math.hypot(...add(moon.pos, scale(sun.dir, -along)));
  moon.light = .5 * (1 - dot(moon.dir, sun.dir)) * (along > 0 ? 1 : smooth(.92 * R, 1.2 * R, aside));
  // Ice ages come and go, and the sea falls and rises with them as water is locked away and released.
  world.warm = 1 + .14 * Math.sin(world.clock * 2 * Math.PI / 1500);
  const level = world.ice0 === null ? 0 : clamp(5 * (world.warm - 1) + 3 * (world.ice0 - world.meanIce), -1.6, .7);
  world.sea += (level - world.sea) * ease(t, 25);
}

const MAXSTEPS = N > 512 ? 3 : 5;
function simulate(dt) {
  stepDebt = Math.min(stepDebt + dt * 110 * (1 + world.far) * view.sim, MAXSTEPS);
  let steps = Math.floor(stepDebt); stepDebt -= steps;
  if (warmup > 0) { steps = MAXSTEPS; warmup -= steps; }
  const g = globals(), lift = brush.s * clamp(.6 * brush.radius, 11, 18) * dt / Math.max(steps, 1);   // a rate per second, not per step; gentler up close
  // Lava keeps its own clock, one tick a frame, and only while there is any: from the hand's first
  // push until a while after the last of it has gone dark.
  const push = Math.max(brush.s, 0);
  brush.vent += (push - brush.vent) * ease(dt, push > brush.vent ? .15 : 2.5);   // the vents stay open a while after the hand lifts
  if (brush.vent > .02 || world.fire > 0) world.molten = world.time + 20;
  const tick = steps && world.time < world.molten ? Math.min(dt * 60, 1.1) : 0;
  for (let i = 0; i < steps; i++) {
    draw(P.flux, fluxes[1], { ...g, uS: stateA, uF: fluxes[0].tex }); fluxes.reverse();
    draw(P.flow, toFlow, { ...g, uS: stateA, uF: fluxes[0].tex });
    draw(P.erode, toStateA, { ...g, uS: stateB, uV: velocity, uC: lives[0].tex, uRock: rock, uLen: lengths, uW: weather[0].tex,
      uRain: .0045, uBrush: [...brush.dir, lift], uBrushR: brush.radius, uL: lavas[0].tex, uTick: i === steps - 1 ? tick : 0 });
  }
  if (tick) {
    draw(P.lava, lavas[1], { ...g, uS: stateA, uL: lavas[0].tex, uRock: rock, uLen: lengths, uW: weather[0].tex,
      uBrush: [...brush.dir, 4.5 * brush.vent * dt], uBrushR: brush.radius, uTick: tick, uStamp: stamp() });
    lavas.reverse();
  }
  if (steps) {
    draw(P.life, lives[1], { ...g, uS: stateA, uC: lives[0].tex, uG: lives[0].textures[1], uD3: D[3], uW: weather[0].tex, uLen: lengths, uSteps: steps, uPeople: world.age > 240 && Math.random() < .4 ? 1 : 0 });   // now and then, somewhere, a first fire
    lives.reverse();
  }
  draw(P.derive, toDerived, { ...g, uS: stateA, uV: velocity, uC: lives[0].tex, uL: lavas[0].tex, uStamp: stamp() });
  for (const i of frameCount & 1 ? [0] : [0, 3]) { gl.bindTexture(gl.TEXTURE_2D, D[i]); gl.generateMipmap(gl.TEXTURE_2D); }   // the film of rain needs fresh mips; people and fire can wait a frame
  // Shadows and weather change slowly: they take turns.
  if (frameCount & 1) draw(P.shadow, toShadow, { ...g, uD0: D[0], uG: lives[0].textures[1], uSun: sun.dir });
  else {
    draw(P.weather, weather[1], { ...g, uPrev: weather[0].tex, uD0: D[0], uD3: D[3], uDt: .05 * 2 * world.dt, uClock: world.clock, uVortex: vortexData });
    weather.reverse();
  }
}

// Cyclones are born, drift and die: tropical ones head west and poleward, the rest ride the
// westerlies. Lightning strikes from wherever the forecast shows the heaviest rain.
const vortices = Array.from({ length: 6 }, () => ({ age: 1 }));
const vortexData = new Float32Array(24), flashData = new Float32Array(16);
let storms = [], flashSlot = 0;
function decode(u, v) {             // the shaders' octahedral map, for the few places the CPU needs it
  const x = u * 2 - 1, z = v * 2 - 1, y = 1 - Math.abs(x) - Math.abs(z), t = Math.max(-y, 0);
  return norm([x - Math.sign(x) * t, y, z - Math.sign(z) * t]);
}
function updateWeather(dt) {
  const t = world.dt;
  vortices.forEach((v, i) => {
    v.age += t / v.span;
    if (!(v.age < 1)) {
      const hemi = Math.random() < .5 ? -1 : 1, tropical = Math.random() < .4;
      Object.assign(v, { age: 0, span: 90 + 120 * Math.random(), lon: 6.283 * Math.random(), hemi,
        lat: hemi * (tropical ? .15 + .15 * Math.random() : .6 + .4 * Math.random()),
        dlon: tropical ? -.012 : .01, dlat: hemi * (tropical ? .003 : .0008) });
    }
    v.lon += t * v.dlon; v.lat += t * v.dlat;
    const c = Math.cos(v.lat);                 // anticlockwise in the north, clockwise in the south
    vortexData.set([c * Math.sin(v.lon), Math.sin(v.lat), c * Math.cos(v.lon), v.hemi * Math.sin(Math.PI * v.age) ** 2], i * 4);
  });
  for (let i = 3; i < 16; i += 4) flashData[i] *= Math.exp(-dt * 9);
  if (storms.length && Math.random() < dt * (.4 + world.far) * Math.min(storms.length, 8)) {
    const cell = storms[Math.floor(Math.random() * storms.length)];
    const at = decode((cell % 16 + Math.random()) / 16, ((cell >> 4) + Math.random()) / 16);
    flashData.set([...at, .5 + .5 * Math.random()], (flashSlot++ % 4) * 4);
    thunder(at);
  }
}

// ───────────────────────────────────────────────────────────── leaving
// Fire, then towns, then roads; and once enough of the planet is lit, someone leaves it. A ship
// climbs from the capital and crosses to the moon, where a light comes on. Others follow, and
// each leaves a satellite behind.
const craftData = new Float32Array(40);
const voyage = { t: -1, next: 0, count: 0, ripe: 0, dir: [0, 0, 1], trail: [] };
const sats = [0, 1, 2, 3].map(i => ({ axis: norm([Math.sin(i * 2.4), .5 + .4 * Math.cos(i * 1.7), Math.cos(i * 2.4)]), turn: .09 + .02 * i, r: (1.17 + .035 * i) * R }));
function updateVoyage(dt) {
  const v = voyage;
  craftData.fill(0);
  sats.forEach((s, i) => {
    if (i >= v.count) return;
    const e1 = norm(cross(s.axis, [0, 1, 0])), e2 = cross(s.axis, e1), a = world.time * s.turn + i * 1.9;
    const p = scale(add(scale(e1, Math.cos(a)), scale(e2, Math.sin(a))), s.r), along = dot(p, sun.dir);
    const lit = along > 0 || Math.hypot(...add(p, scale(sun.dir, -along))) > R;    // they shine only while the sun reaches them
    craftData.set([...p, lit ? -1.5 : 0], i * 4);
  });
  if (v.t < 0) {
    if (world.city > .22) v.ripe += dt;                            // it takes an age of cities first
    if (!(started && world.capital && v.ripe > 50 && world.time > v.next)) return;
    Object.assign(v, { t: 0, dir: world.capital, trail: [] });
    if (audio.ac) { thunder(v.dir); [5, 7, 9].forEach((step, i) => setTimeout(() => pluck(noteAt(step), .045, 0, 5), i * 240)); }
  }
  v.t += dt / 44;
  // Straight up at first, then leaning over toward the moon, and homing on it at the end.
  v.dir = toward(v.dir, moon.dir, ease(dt, 9 * (1 - v.t) + .3) * smooth(.05, .25, v.t));
  const s = v.t * v.t * (3 - 2 * v.t), from = 1.02 * R, burn = .3 + .7 * Math.max(1 - smooth(.12, .3, v.t), smooth(.85, .95, v.t));
