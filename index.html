  v.trail.length = Math.min(v.trail.length, 26);
  for (let k = 0; k < 6; k++) craftData.set([...v.trail[Math.min(k * 5, v.trail.length - 1)], (k ? 5 : 30) * (1 - k / 6) * burn], 16 + k * 4);
  if (v.t >= 1) {
    Object.assign(v, { t: -1, next: world.time + 70 + 70 * Math.random(), count: v.count + 1 });
    moon.base = Math.min(1, moon.base + .2);
    if (audio.ac) pluck(noteAt(12), .04, 0, 7);
  }
}

// ───────────────────────────────────────────────────────────── camera
// The camera circles the planet. As it comes close it tips up, so the horizon and the sky above
// it stay in the upper part of the frame.
function updateCamera(dt) {
  const turnKey = (keys.arrowleft || keys.a ? 1 : 0) - (keys.arrowright || keys.d ? 1 : 0);
  const tiltKey = (keys.arrowup || keys.w ? 1 : 0) - (keys.arrowdown || keys.s ? 1 : 0);
  const reach = (cam.dist - R) / R;                    // the surface should move under a finger at the finger's speed
  cam.drift += ((gesture || turnKey ? 0 : 1) - cam.drift) * ease(dt, 2.5);   // hold still while a hand is on the world
  cam.azT += dt * (turnKey * .9 * reach + cam.drift * .015 * reach ** .7);   // drift slowly when close, so the ground does not slide away
  cam.latT = clamp(cam.latT + tiltKey * dt * .7 * reach, -1.35, 1.35);
  cam.distT = clamp(cam.distT, NEAR, FARD);
  const k = ease(dt, .16);
  cam.az += (cam.azT - cam.az) * k; cam.lat += (cam.latT - cam.lat) * k; cam.dist += (cam.distT - cam.dist) * k;
  const cl = Math.cos(cam.lat), out = [cl * Math.sin(cam.az), Math.sin(cam.lat), cl * Math.cos(cam.az)];
  const east = norm(cross([0, 1, 0], out)), north = cross(out, east), aspect = canvas.width / canvas.height;
  cam.tanV = .29 * Math.max(1, 1.2 / aspect);          // a long lens; wider on portrait screens
  const half = Math.atan(cam.tanV), limb = Math.asin(R / cam.dist);
  const up = smooth(.75 * half, 1.5 * half, limb) * (limb - .45 * half);
  cam.pos = scale(out, cam.dist);
  cam.f = norm(add(scale(out, -Math.cos(up)), scale(north, Math.sin(up))));
  cam.r = scale(east, cam.tanV * aspect); cam.u = scale(cross(east, cam.f), cam.tanV);
}
const pointerRay = () => norm(add(cam.f, add(scale(cam.r, pointer.x / innerWidth * 2 - 1), scale(cam.u, 1 - pointer.y / innerHeight * 2))));
// Where a ray from the camera meets a sphere of radius r about the planet's centre; off the limb, the nearest point to it.
function onSphere(rd, r) {
  const b = dot(cam.pos, rd), h = b * b - dot(cam.pos, cam.pos) + r * r;
  return norm(add(cam.pos, scale(rd, h > 0 ? -b - Math.sqrt(h) : -b)));
}

// ───────────────────────────────────────────────────────────── input
// One finger or the left button sculpts where it lands on the planet, and turns the planet where
// it lands on space. Which of the two is decided by the GPU pick on the next frame.
const pointer = { x: innerWidth / 2, y: innerHeight / 2, hover: false, carve: false, anchor: R, touch: false, since: 0 };
const touches = new Map(), keys = {}, tool = $('tool');
let gesture = null, pinch = 0;     // null | 'pending' | 'sculpt' | 'orbit' | 'pinch'
const carving = () => pointer.carve || keys.shift || tool.classList.contains('carve');
const spread = () => { const [a, b] = [...touches.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
function turn(dx, dy) {
  const k = (cam.dist - R) / R * 2 * cam.tanV / innerHeight;
  cam.azT -= dx * k / Math.max(.3, Math.cos(cam.lat)); cam.latT += dy * k;
}

canvas.addEventListener('pointerdown', e => {
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!started) begin(e.pointerType);
  idle = 0;
  if (touches.size === 1) {
    Object.assign(pointer, { x: e.clientX, y: e.clientY, carve: e.button === 2, touch: e.pointerType === 'touch', since: world.time });
    gesture = 'pending';
  } else { gesture = 'pinch'; pinch = spread(); }
});
canvas.addEventListener('pointermove', e => {
  const p = touches.get(e.pointerId);
  idle = 0;
  if (!p) { Object.assign(pointer, { x: e.clientX, y: e.clientY, hover: e.pointerType === 'mouse' }); return; }
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (gesture === 'pinch' && touches.size > 1) {
    const s = spread(); cam.distT = R + (cam.distT - R) * pinch / s; pinch = s;
    turn(dx * .5, dy * .5);
  } else {
    pointer.x = e.clientX; pointer.y = e.clientY;
    if (gesture === 'orbit') turn(dx, dy);
  }
});
const release = e => { touches.delete(e.pointerId); gesture = touches.size ? 'orbit' : null; };
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', () => { pointer.hover = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('gesturestart', e => e.preventDefault());   // iOS Safari: keep pinches for the planet, not the page
canvas.addEventListener('wheel', e => { e.preventDefault(); idle = 0; cam.distT = R + (cam.distT - R) * Math.exp(e.deltaY * .0015); }, { passive: false });
tool.addEventListener('click', () => tool.classList.toggle('carve'));
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys[k] = true; idle = 0;
  if (!started) return begin('mouse');
  if (k === ' ') tool.classList.toggle('carve');
  if (k === 'n') newWorld(1 + Math.floor(Math.random() * 36 ** 4));
  if (k === 'm' && audio.out) audio.out.gain.setTargetAtTime((audio.muted = !audio.muted) ? 0 : .9, audio.ac.currentTime, .2);
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function begin(kind) {
  started = true;
  startAudio();
  $('veil').style.opacity = 0;
  const hint = $('hint');
  hint.textContent = kind === 'touch' ? 'drag the sea to raise land  ·  drag space to turn  ·  pinch to descend'
                                      : 'drag the sea to raise land  ·  shift-drag to carve  ·  scroll to descend';
  hint.style.opacity = .85; tool.style.opacity = .8;
  setTimeout(() => { hint.style.opacity = 0; }, 12000);
}

// When nobody is here, an unseen hand keeps working, so the piece is never a still.
const ghost = { next: 4, until: 0, dir: [0, 0, 1], vel: [0, 0, 0], sign: 1 };
function haunt(dt) {
  if (world.time > ghost.next) {
    const dir = norm([Math.random() - .5, .8 * (Math.random() - .5), Math.random() - .5]);
    const vel = scale(norm(cross(dir, [Math.random() - .5, Math.random() - .5, Math.random() - .5])), .08 + .1 * Math.random());
    const dur = 2.5 + 4 * Math.random();
    // Keep land and sea in rough balance over hours of idling.
    const drift = world.meanH - (world.land0 === null ? world.meanH : world.land0);
    const sign = drift > 1.2 ? -1 : drift < -.5 ? 1 : Math.random() < .75 ? 1 : -1;
    Object.assign(ghost, { dir, vel, sign, until: world.time + dur, next: world.time + dur + 2.5 + 5 * Math.random() });
  }
  if (world.time > ghost.until) return 0;
  brush.target = ghost.dir = norm(add(ghost.dir, scale(ghost.vel, dt)));
  return ghost.sign;
}

// A census every half second or so: the planet's averages, and where it is raining hardest.
const pickBuf = new Float32Array(16), statBuf = new Float32Array(4), forecast = new Float32Array(1024), gazetteer = new Float32Array(4096);
function census() {
  const mean = i => { gl.bindFramebuffer(gl.FRAMEBUFFER, means[i]); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, statBuf); return statBuf; };
  gl.bindTexture(gl.TEXTURE_2D, D[2]); gl.generateMipmap(gl.TEXTURE_2D);   // the other two refresh their mips every frame
  let m = mean(0); world.meanH = m[0]; world.meanSpeed = m[3];
  world.meanIce = mean(1)[3];
  m = mean(2); world.people = m[0]; world.fire = m[2];
  gl.bindFramebuffer(gl.FRAMEBUFFER, towns); gl.readPixels(0, 0, 32, 32, gl.RGBA, gl.FLOAT, gazetteer);
  let most = .08, where = -1;                    // the capital is wherever the most people live
  for (let i = 0; i < 1024; i++) if (gazetteer[i * 4] > most) { most = gazetteer[i * 4]; where = i; }
  world.city = most;
  world.capital = where < 0 ? null : decode(((where % 32 + .5) / 32 * G - 1) / N, ((where >> 5) + .5) / 32 * G / N - 1 / N);
  if (world.ice0 === null && warmup <= 0) { world.ice0 = world.meanIce; world.land0 = world.meanH; }
  gl.bindTexture(gl.TEXTURE_2D, weather[0].tex); gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindFramebuffer(gl.FRAMEBUFFER, weather[0].forecast); gl.readPixels(0, 0, 16, 16, gl.RGBA, gl.FLOAT, forecast);
  storms = [];
  for (let i = 0; i < 256; i++) if (forecast[i * 4 + 1] > .3) storms.push(i);
}

function updateBrush(dt) {
  // Ask the GPU where the pointer's ray lands, what lies under the brush, and what we are looking at.
  const rd = pointerRay();
  look.dir = onSphere(cam.f, R); look.range = Math.hypot(...add(cam.pos, scale(look.dir, -R)));
  draw(P.pick, toPick, { ...eye(), uW: weather[0].tex, uD3: D[3], uRd: rd, uProbe: brush.dir, uLook: cam.f });
  gl.readPixels(0, 0, 4, 1, gl.RGBA, gl.FLOAT, pickBuf);
  const hit = pickBuf[3] > 0, at = [pickBuf[0], pickBuf[1], pickBuf[2]];
  Object.assign(world, { h: pickBuf[4] - world.sea, water: pickBuf[5], speed: pickBuf[7] });
  Object.assign(look, { h: pickBuf[8], veg: pickBuf[9], rain: pickBuf[10], hit: pickBuf[11] > 0, people: pickBuf[12], fire: pickBuf[14] });
  if (frameCount % 30 === 0) census();

  // A finger waits a moment before it sculpts, in case a second one is on its way to make a pinch.
  if (gesture === 'pending' && (!pointer.touch || world.time - pointer.since > .09)) {
    gesture = hit ? 'sculpt' : 'orbit';
    if (hit) { pointer.anchor = Math.hypot(...at); brush.dir = brush.target = norm(at); }
  }
  let want = 0, glow = 0;
  if (gesture === 'sculpt') {
    // Drag along the sphere through the first touch: the land rising under the pointer must
    // not pull the brush toward the camera.
    brush.target = onSphere(rd, pointer.anchor);
    want = carving() ? -1 : 1; glow = 1;
  } else if (idle > 18 || !started) want = haunt(dt);
  else if (pointer.hover && !gesture && hit) { brush.target = norm(at); glow = .35; }

  // The hand has mass: it eases in, and the land keeps moving for a moment after letting go.
  brush.dir = toward(brush.dir, brush.target, ease(dt, want || glow ? .07 : 1e-3));
  brush.s += (want - brush.s) * ease(dt, Math.abs(want) > Math.abs(brush.s) ? .14 : .32);
  brush.glow += (Math.max(glow, Math.abs(brush.s)) - brush.glow) * ease(dt, .2);
  // The brush covers the same share of the picture at any height, so descending means finer work.
  brush.radius = Math.max(5, .22 * look.range * cam.tanV * Math.min(1, canvas.width / canvas.height));
}

// ───────────────────────────────────────────────────────────── adaptive quality
// The picture is rendered at a fraction of the canvas and scaled so that frames never drop. If
// that is not enough, the simulation slows down too: the world just ages more gently.
const view = { scale: 0, sim: 1, ema: 1 / 60, timer: 0, calm: 0, ceiling: 1 };
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr); canvas.height = Math.round(innerHeight * dpr);
  if (!view.scale) view.scale = clamp(Math.sqrt(6e5 / (canvas.width * canvas.height)), .3, 1);   // start modest, then climb
  buildTargets();
}
function buildTargets() {
  for (const t of view.targets || []) { t.textures.forEach(x => gl.deleteTexture(x)); gl.deleteFramebuffer(t.fbo); }
  const w = Math.max(2, Math.round(canvas.width * view.scale)), h = Math.max(2, Math.round(canvas.height * view.scale));
  const third = () => texture(Math.ceil(w / 3), Math.ceil(h / 3), gl.RGBA16F, gl.NEAREST);
  view.scene = target(texture(w, h, gl.RGBA16F, gl.LINEAR));
  view.ldr = target(texture(w, h, gl.RGBA8, gl.LINEAR));
  view.air = target(third(), third());
  view.bloom = [1, 2, 3, 4, 5].map(i => target(texture(Math.max(1, w >> i), Math.max(1, h >> i), gl.RGBA16F, gl.LINEAR)));
  view.targets = [view.scene, view.ldr, view.air, ...view.bloom];
}
function adapt(dt) {
  if (dt > .1) return;                           // a hitch or a tab switch says nothing about the GPU
  view.ema += (dt - view.ema) * .06; view.timer += dt; view.calm += dt;
  if (view.timer < .7) return;
  view.timer = 0;
  let s = view.scale;
  if (view.ema > 1 / 50) { s *= .84; view.ceiling = s; view.calm = 0; }
  else if (view.ema > 1 / 56) { s *= .93; view.ceiling = s; view.calm = 0; }
  else if (view.calm > 1.4) { s *= 1.1; view.ceiling = Math.min(1, view.ceiling * 1.004); }   // probe upward, remembering what failed
  if (s < .3) view.sim = Math.max(.2, view.sim * .8);
  else if (view.calm > 4 && view.sim < 1) view.sim = Math.min(1, view.sim * 1.1);
  s = clamp(Math.min(s, view.ceiling), .3, 1);
  if (Math.abs(s - view.scale) > .01) { view.scale = s; buildTargets(); }
}
addEventListener('resize', resize);

function render() {
  const { scene, ldr, bloom, air } = view, res = [scene.w, scene.h];
  const shared = { ...eye(), uSun: sun.dir, uW: weather[0].tex, uFlash: flashData, uMoon: [...moon.pos, moon.light],
    uTurn: [Math.cos(moon.angle), Math.sin(moon.angle)], uBase: moon.base };
  draw(P.air, air, { ...shared, uRes: [air.w, air.h] });
  draw(P.render, scene, { ...shared, uD1: D[1], uD2: D[2], uD3: D[3], uSh: toShadow.tex, uAir: air.tex, uAirPass: air.textures[1],
    uRes: res, uBrush: [...brush.dir, brush.glow * .55], uBrushR: brush.radius, uCraft: craftData });
  // Bloom: threshold, walk down a pyramid, then add each level back into the one above.
  let src = scene;
  bloom.forEach((b, i) => { draw(P.blur, b, { uT: src.tex, uRes: [b.w, b.h], uSpread: .5, uKnee: i ? 0 : 1.1 }); src = b; });
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = bloom.length - 1; i > 0; i--)
    draw(P.blur, bloom[i - 1], { uT: bloom[i].tex, uRes: [bloom[i - 1].w, bloom[i - 1].h], uSpread: 1, uKnee: 0 });
  gl.disable(gl.BLEND);
  // Expose for what the camera faces: the night side wants a wider aperture.
  const facing = .5 * dot(add(look.dir, norm(cam.pos)), sun.dir), exposure = .5 + 1.4 * (1 - smooth(-.45, .25, facing)) * (1 - .5 * world.far);
  draw(P.lens, ldr, { uScene: scene.tex, uBloom: bloom[0].tex, uRes: res, uExposure: exposure, uFocus: look.range,
    uBlur: 1 - smooth(NEAR, R + 4 * (NEAR - R), cam.dist) });
  draw(P.present, null, { uTime: world.time, uImg: ldr.tex, uRes: [canvas.width, canvas.height], uSrc: res, uVeil: started ? 0 : 1 });
}

// ───────────────────────────────────────────────────────────── sound
// Everything is synthesised from oscillators and one buffer of white noise, and mixed by what the
// camera is looking at. Close to the ground: sea, wind, rivers, rain, birds, thunder. From orbit
// those fall away and a slow pad opens up. The earth rumbles under the hand and sings a
// pentatonic scale as it passes through heights.
const audio = {};
const PENTATONIC = [0, 2, 4, 7, 9];
const noteAt = step => audio.root * 2 ** ((PENTATONIC[((step % 5) + 5) % 5] + 12 * Math.floor(step / 5)) / 12);

function startAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC || audio.ac) return;
  const ac = audio.ac = new AC(), out = audio.out = ac.createGain();
  out.gain.value = 0; out.gain.setTargetAtTime(.9, ac.currentTime, 1.2);
  out.connect(ac.createDynamicsCompressor()).connect(ac.destination);
  audio.root = 110 * 2 ** ([0, 2, 3, 5, 7][seed % 5] / 12);

  // Reverb: convolve with noise that decays and darkens, which is what a large space does to a click.
  const len = ac.sampleRate * 4 | 0, impulse = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = impulse.getChannelData(ch); let low = 0;
    for (let i = 0; i < len; i++) { const t = i / len; low += (Math.random() * 2 - 1 - low) * (1 - .93 * Math.sqrt(t)); data[i] = low * (1 - t) ** 3.5; }
  }
  audio.verb = ac.createConvolver(); audio.verb.buffer = impulse;
  const wet = ac.createGain(); wet.gain.value = .55; audio.verb.connect(wet).connect(out);

  const hiss = audio.hiss = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate), data = hiss.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const layer = (type, freq, q) => {       // looping noise through one filter and a gain
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = hiss; src.loop = true; src.playbackRate.value = .8 + .4 * Math.random();
    f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = 0;
    src.connect(f).connect(g).connect(out); src.start();
    return { f: f.frequency, g: g.gain };
  };
  audio.sea = layer('lowpass', 400, .4); audio.wind = layer('bandpass', 650, .7);
  audio.water = layer('bandpass', 2600, .6); audio.rumble = layer('lowpass', 85, 1.5);
  audio.rain = layer('highpass', 3800, .3); audio.fire = layer('bandpass', 1300, .8);

  const voice = (type, freq, gain, dest) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = gain; o.connect(g).connect(dest); o.start();
    return { f: o.frequency, g: g.gain };
  };
  audio.sub = voice('sine', 41, 0, out);
  // The earth's voice: a soft tone under the current note, heard only while sculpting.
  const mellow = ac.createBiquadFilter(); mellow.frequency.value = 500; mellow.connect(out); mellow.connect(audio.verb);
  audio.earth = voice('triangle', audio.root, 0, mellow);
  // A slow pad of four voices drifting between chords of the same scale.
  const pad = audio.padFilter = ac.createBiquadFilter(); pad.frequency.value = 500; pad.Q.value = .4;
  pad.connect(out); pad.connect(audio.verb);
  audio.pad = [0, 7, 16, 19].map((s, i) => voice(i % 2 ? 'triangle' : 'sawtooth', audio.root * 2 ** (s / 12) * (1 + (i - 1.5) * .0015), .013, pad));
  audio.nextChord = audio.nextNote = 0; audio.step = 0;
}

function pluck(freq, level, pan, decay) {      // a bell: a sine and inharmonic partials that die faster
  const { ac, out, verb } = audio, t = ac.currentTime, p = ac.createStereoPanner ? ac.createStereoPanner() : ac.createGain();
  if (p.pan) p.pan.value = pan;
  p.connect(out); p.connect(verb);
  [[1, 1, decay], [2.756, .3, decay * .35], [5.4, .1, decay * .15]].forEach(([ratio, amp, dur]) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = freq * ratio;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level * amp, t + .004); g.gain.exponentialRampToValueAtTime(1e-4, t + dur);
    o.connect(g).connect(p); o.start(t); o.stop(t + dur);
  });
}
function thunder(at) {      // a distant roll, not a crack: soft onset, dark from the start; only what is close to the view is heard
  const { ac, out, verb, hiss } = audio, level = .16 * (1 - world.far) * Math.exp(-40 * (1 - dot(at, look.dir)));
  if (!ac || level < .01) return;
  const t = ac.currentTime + .4 + 1.5 * Math.random(), src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = hiss; src.playbackRate.value = .45;
  f.frequency.setValueAtTime(320, t); f.frequency.exponentialRampToValueAtTime(55, t + 3);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(level, t + .35); g.gain.exponentialRampToValueAtTime(1e-3, t + 4);
  src.connect(f).connect(g); g.connect(out); g.connect(verb);
  src.start(t, Math.random()); src.stop(t + 4.1);
}
function chirp() {
  const { ac, verb, out } = audio, base = 2300 + 2600 * Math.random(), n = 2 + Math.floor(Math.random() * 4);
  let t = ac.currentTime;
  for (let i = 0; i < n; i++, t += .07 + .06 * Math.random()) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(base * (.9 + .3 * Math.random()), t);
    o.frequency.exponentialRampToValueAtTime(base * (.7 + .7 * Math.random()), t + .06);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.012, t + .012); g.gain.exponentialRampToValueAtTime(1e-4, t + .09);
    o.connect(g); g.connect(verb); g.connect(out); o.start(t); o.stop(t + .1);
  }
}
const CHORDS = [[0, 7, 16, 19], [-3, 9, 12, 16], [-7, 5, 9, 12], [-5, 7, 14, 16], [2, 9, 14, 17]];
function updateAudio(dt) {
  const a = audio; if (!a.ac) return;
  const t = a.ac.currentTime, s = Math.abs(brush.s), to = (param, v, tau = .08) => param.setTargetAtTime(v, t, tau);
  const close = 1 - world.far, day = smooth(-.1, .2, dot(look.dir, sun.dir));
  const ocean = look.hit ? smooth(1, -1, look.h) : 0, ground = look.hit ? 1 - ocean : 0;
  to(a.sea.g, close * ocean * (.075 + .035 * Math.sin(world.time * .43) + .02 * Math.sin(world.time * .171)), .4);
  to(a.sea.f, 380 + 170 * Math.sin(world.time * .43 + 1), .3);
  to(a.wind.g, .012 + .02 * close + .012 * Math.sin(world.time * .23), .4);
  to(a.wind.f, 420 + 300 * close + 200 * Math.sin(world.time * .11), .5);
  to(a.water.g, Math.min(.1, close * world.meanSpeed * 2.2 + world.speed * world.water * .08), .25);
  to(a.rain.g, Math.min(.07, close * look.rain * .12), .6);
  to(a.fire.g, Math.min(.1, close * look.fire * 1.5) * (.3 + 1.4 * Math.random() ** 4), .025);   // lava crackles: a gain that jumps about
  to(a.rumble.g, s * .75); to(a.sub.g, s * .2);
  to(a.sub.f, 38 + 10 * s + 3 * Math.sin(world.time * 9));

  // Melody: the height of the land under the hand, quantised to the scale.
  const step = Math.floor(world.h / 3);
  if (s > .25 && step !== a.step && t > a.nextNote) {
    pluck(noteAt(step + 5), .05 + .06 * s, clamp(pointer.x / innerWidth * 2 - 1, -1, 1) * .7, brush.s > 0 ? 2.6 : 1.4);
    a.nextNote = t + .07;
  }
  a.step = step;
  to(a.earth.f, noteAt(step) / 2, .12); to(a.earth.g, s * .11, .1);

  if (t > a.nextChord) {
    const chord = CHORDS[Math.floor(Math.random() * CHORDS.length)];
    a.pad.forEach((v, i) => to(v.f, a.root * 2 ** (chord[i] / 12) * (1 + (i - 1.5) * .0015), 1.6));
    a.nextChord = t + 12 + 10 * Math.random();
    if (Math.random() < .3 + .5 * world.far) pluck(a.root * 2 ** ((chord[2 + (Math.random() < .5)] + 12) / 12), .018, Math.random() - .5, 5);
  }
  to(a.padFilter.frequency, 240 + 420 * day + 500 * world.far + 300 * s, 1);
  if (Math.random() < dt * close * ground * day * Math.min(look.veg * 2.5, 1.6) * (1 - Math.min(look.rain * 3, .9))) chirp();   // birds shelter from rain
  if (Math.random() < dt * close * .12 * Math.min(look.people * 3, 1)) pluck(noteAt(Math.floor(Math.random() * 5)), .012, Math.random() - .5, 4);   // and where there is a town, now and then, a bell
}

// ───────────────────────────────────────────────────────────── main loop
let last = 0;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  idle += dt; frameCount++;
  adapt(dt);
  updateCamera(dt);
  updateTime(dt);
  updateWeather(dt);
  updateVoyage(dt);
  simulate(dt);
  updateBrush(dt);
  render();
  updateAudio(dt);
  requestAnimationFrame(frame);
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); $('veil').style.opacity = 1; $('go').textContent = 'the graphics context was lost — reload to continue'; });
if (matchMedia('(pointer: coarse)').matches) $('go').textContent = 'touch to begin';
newWorld(seed);
resize();
updateCamera(0);
cam.dist = cam.distT = R / Math.sin(.78 * Math.atan(cam.tanV * Math.min(1, canvas.width / canvas.height)));   // open with the whole planet in frame
requestAnimationFrame(t => { last = t; frame(t); });
</script>
</body>
